[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alert-engine"
version = "0.0.1"
description = "AI-enabled Alert Correlation Engine with Site Analysis Tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Alert Engine Team"}
]
keywords = ["alert", "correlation", "ai", "mcp", "telecommunications"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core data processing packages
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    # MCP server framework
    "mcp>=1.13.0",
    # Async utilities
    "nest-asyncio>=1.5.0",
    # Logging
    "loguru>=0.7.0",
    # Configuration and environment
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "networkx>=3.4.2",
    "fastmcp>=2.12.3",
    # Web framework for gateway
    "fastapi>=0.115.0",
    "uvicorn>=0.35.0",
    "httpx>=0.28.0",
    "matplotlib>=3.10.6",
    "seaborn>=0.13.2",
    "plotly>=6.3.0",
    "psutil>=7.0.0",
    "psycopg2-binary>=2.9.10",
    "boto3>=1.40.44",
    "sqlalchemy>=2.0.43",
    "ijson>=3.4.0",
    "diagrams>=0.24.4",
    "graphviz>=0.20.3",
    "pillow>=11.3.0",
    "pytest-asyncio>=1.2.0",
    "behave>=1.3.3",
    "pexpect>=4.9.0",
    "moto>=5.1.17",
    "pytest-html>=4.1.1",
    "behave-html-formatter>=0.9.10",
    "pytest-json-report>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "jupyter>=1.0.0",
    "ipython>=8.0.0",
    "ipdb>=0.13.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]
test = [
    "behave>=1.3.3",
    "pexpect>=4.9.0",
    "moto>=5.1.17",
    "cucumber-expressions>=18.0.1",
    "cucumber-tag-expressions>=8.0.0",
    "parse-type>=0.6.6",
    "colorama>=0.4.6",
    "xmltodict>=1.0.2",
    "ptyprocess>=0.7.0",
    "behave-html-formatter>=0.9.10",
    "freezegun>=1.2.0",
    "responses>=0.24.0",
    "hypothesis>=6.100.0",
]
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.0.0",
]
ml = [
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "torch>=2.1.0",
    "torch-geometric>=2.4.0",
    "networkx>=3.0.0",
]
export = [
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
]

[project.scripts]
alert-engine-server = "src.server:main"
site-analyzer-test = "test_site_analyzer:main"

[project.urls]
Homepage = "https://github.com/your-org/alert-engine"
Documentation = "https://github.com/your-org/alert-engine#readme"
Repository = "https://github.com/your-org/alert-engine.git"
Issues = "https://github.com/your-org/alert-engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.behave]
paths = ["tests/bdd/features"]
format = ["pretty"]
show_skipped = false
show_timings = true
stdout_capture = false
stderr_capture = false
log_capture = false
color = true
summary = true

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

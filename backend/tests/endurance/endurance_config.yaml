# WXCC Simulator MCP Tool Test Scenarios
# These scenarios test the simulator tool under continuous load
simulator_test_scenarios:
  # Seed/Reset cycle - tests memory handling for repeated data operations
  - name: "simulator_seed_reset_cycle"
    description: "Repeated seed and reset operations to test stability"
    tool: "wxcc_simulator_tool"
    steps:
      - action: "reset"
      - action: "seed"
        params:
          num_tasks: 10
          include_recordings: true
      - action: "status"
      - action: "list_tasks"
      - action: "reset"
    iterations: 50
    delay_between_steps_ms: 100
    
  # Simulate call cycle - tests task creation under load
  - name: "simulator_call_creation"
    description: "Create many simulated calls to test performance"
    tool: "wxcc_simulator_tool"
    steps:
      - action: "simulate_call"
        params:
          duration: 180
          status: "completed"
    iterations: 100
    delay_between_steps_ms: 50
    
  # Status monitoring - tests health check under load
  - name: "simulator_status_monitoring"
    description: "Repeated status checks to test monitoring stability"
    tool: "wxcc_simulator_tool"
    steps:
      - action: "status"
    iterations: 200
    delay_between_steps_ms: 25

# Call Processing Journey API Test Scenarios
# These scenarios test the journey API endpoints under continuous load
call_process_api_scenarios:
  # Complete journey workflow - tests full CRUD cycle
  - name: "journey_complete_workflow"
    description: "Create journey, add stage, run job, check status"
    api_endpoints:
      - method: "POST"
        endpoint: "/api/v1/journeys"
        body:
          name: "Endurance Test Journey"
          description: "Created during endurance testing"
          odaComponentType: "CALLCENTER"
      - method: "POST"
        endpoint: "/api/v1/journeys/{journey_id}/stages"
        params:
          stage_id: "call_process"
          name: "Call Processing"
      - method: "POST"
        endpoint: "/api/v1/journeys/{journey_id}/jobs"
        params:
          stage_id: "call_process"
          triggered_by: "endurance-test"
      - method: "GET"
        endpoint: "/api/v1/journeys/{journey_id}/jobs/{job_id}/status"
      - method: "DELETE"
        endpoint: "/api/v1/journeys/{journey_id}"
        params:
          force: true
    iterations: 50
    delay_between_steps_ms: 100
    
  # Stage management cycle - tests stage CRUD operations
  - name: "stage_management_cycle"
    description: "Add, update, and remove stages repeatedly"
    api_endpoints:
      - method: "POST"
        endpoint: "/api/v1/journeys/{journey_id}/stages"
        params:
          stage_id: "call_process"
      - method: "GET"
        endpoint: "/api/v1/journeys/{journey_id}/stages"
      - method: "PUT"
        endpoint: "/api/v1/journeys/{journey_id}/stages/call_process"
        params:
          status: "running"
      - method: "DELETE"
        endpoint: "/api/v1/journeys/{journey_id}/stages/call_process"
    iterations: 100
    delay_between_steps_ms: 50
    
  # Job execution cycle - tests job management under load
  - name: "job_execution_cycle"
    description: "Run and monitor jobs continuously"
    api_endpoints:
      - method: "POST"
        endpoint: "/api/v1/journeys/{journey_id}/jobs"
        params:
          stage_id: "call_process"
      - method: "GET"
        endpoint: "/api/v1/journeys/{journey_id}/jobs/{job_id}/status"
      - method: "GET"
        endpoint: "/api/v1/journeys/{journey_id}/jobs/{job_id}"
      - method: "GET"
        endpoint: "/api/v1/journeys/{journey_id}/jobs"
    iterations: 100
    delay_between_steps_ms: 50
    
  # Job polling stress test - simulates UI polling behavior
  - name: "job_status_polling"
    description: "Rapid job status polling to simulate UI"
    api_endpoints:
      - method: "GET"
        endpoint: "/api/v1/journeys/{journey_id}/jobs/{job_id}/status"
    iterations: 500
    delay_between_steps_ms: 200
    
  # Journey listing with filters - tests query performance
  - name: "journey_list_queries"
    description: "List journeys with various filters"
    api_endpoints:
      - method: "GET"
        endpoint: "/api/v1/journeys"
      - method: "GET"
        endpoint: "/api/v1/journeys?status=pending"
      - method: "GET"
        endpoint: "/api/v1/journeys?component_type=CALLCENTER"
      - method: "GET"
        endpoint: "/api/v1/journeys?limit=10&offset=0"
    iterations: 100
    delay_between_steps_ms: 50

# Combined Call Process + Simulator workflow scenarios
call_process_simulator_scenarios:
  # Full E2E workflow with simulator
  - name: "e2e_simulator_processing"
    description: "Complete E2E: seed simulator, create journey, run job"
    steps:
      - tool: "wxcc_simulator_tool"
        action: "reset"
      - tool: "wxcc_simulator_tool"
        action: "seed"
        params:
          num_tasks: 5
          include_recordings: true
      - api:
          method: "POST"
          endpoint: "/api/v1/journeys"
          body:
            name: "E2E Endurance Test"
            odaComponentType: "CALLCENTER"
      - api:
          method: "POST"
          endpoint: "/api/v1/journeys/{journey_id}/stages"
          params:
            stage_id: "call_process"
      - api:
          method: "POST"
          endpoint: "/api/v1/journeys/{journey_id}/jobs"
          params:
            stage_id: "call_process"
      - api:
          method: "GET"
          endpoint: "/api/v1/journeys/{journey_id}/jobs/{job_id}/status"
          poll_until: "completed"
          max_polls: 60
          poll_interval_ms: 1000
      - tool: "wxcc_simulator_tool"
        action: "reset"
    iterations: 20
    delay_between_steps_ms: 500

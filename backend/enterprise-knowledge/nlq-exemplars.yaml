version: "2.0"
name: "NLQ Exemplars - Curated AI Query Builder Knowledge Base"
description: >
  High-precision examples of natural language queries paired with their
  correct structured Virtual Data Layer panel queries. Each exemplar carries
  a list of `query_variants` (substantively different phrasings of the same
  intent). The NLQExemplarGenerator multiplies each variant by:

    1. Synonym substitution (using the `synonyms` map below)
    2. Prefix templates ("show ", "list ", "get me ", etc.)

  so a single curated entry produces 20-50 indexed rows in the pgvector
  store. All multiplied rows share the same `metadata.structured_query`.

  Coverage: every widget query from all 8 solutions defined in
  nexus-ui/src/config/dashboardWidgets.ts plus core supply-chain entity
  patterns. Field names match the dashboard widget definitions exactly so
  queries execute end-to-end through the VirtualQueryService.

  Solutions covered:
    1. Order-to-Cash Monitor (O2C)
    2. Demand Forecasting Engine (DF)
    3. Inventory Optimization (IO)
    4. Procurement and Spend Analytics (PA)
    5. Production and Quality Copilot (PQ)
    6. Supply Chain Risk Radar (SCR)
    7. Customer 360 and Revenue Growth (C360)
    8. ESG and Sustainability Tracker (ESG)

# Synonym map: each key is substituted (case-insensitive, whole-word) with
# any of its values to generate additional indexed phrasings. Plurals are
# listed explicitly to avoid fragile programmatic pluralization. Keep this
# list curated; over-broad synonyms cause noisy retrieval.
synonyms:
  vendor: [supplier]
  vendors: [suppliers]
  supplier: [vendor]
  suppliers: [vendors]
  account: [customer, client]
  accounts: [customers, clients]
  customer: [account, client]
  customers: [accounts, clients]
  alert: [warning, notification]
  alerts: [warnings, notifications]
  invoice: [bill]
  invoices: [bills]
  order: [purchase]
  orders: [purchases]
  inventory: [stock]
  region: [territory, area]
  regions: [territories, areas]
  category: [type, class]
  categories: [types, classes]
  plant: [facility, factory, site]
  plants: [facilities, factories, sites]
  material: [product, item, sku]
  materials: [products, items, skus]
  forecast: [prediction]
  forecasts: [predictions]
  DSO: [days sales outstanding]
  AR: [accounts receivable]
  OEE: [overall equipment effectiveness]
  MAPE: [forecast accuracy, mean absolute percentage error]
  CLV: [lifetime value, customer lifetime value, ltv]
  STP: [straight through processing]
  OTD: [on time delivery]
  KPI: [metric]
  KPIs: [metrics]

exemplars:
  # ════════════════════════════════════════════════════════════════════
  # SOLUTION 1: ORDER-TO-CASH MONITOR (O2C)
  # ════════════════════════════════════════════════════════════════════

  # ─── O2C_KPI_Snapshot ────────────────────────────────────────────────
  - query_variants:
      - "days sales outstanding"
      - "current DSO"
      - "DSO value"
      - "what is the DSO"
      - "how many days sales outstanding"
    entity: O2C_KPI_Snapshot
    fields: [dso]
    orderBy: "processed_at DESC"
    limit: 1
    panel_type: kpi-card
    title: "Days Sales Outstanding"
    category: o2c_kpi

  - query_variants:
      - "DSO trend over time"
      - "DSO history"
      - "days sales outstanding by month"
      - "how has DSO changed"
    entity: O2C_KPI_Snapshot
    fields: [processed_at, dso]
    aggregation: {function: avg, field: dso}
    groupBy: [processed_at]
    orderBy: "processed_at ASC"
    limit: 100
    panel_type: time-series
    title: "DSO Trend"
    category: o2c_kpi

  - query_variants:
      - "match rate"
      - "current match rate"
      - "three way match rate"
      - "what percent of orders match"
      - "match success rate"
    entity: O2C_KPI_Snapshot
    fields: [match_rate]
    orderBy: "processed_at DESC"
    limit: 1
    panel_type: kpi-card
    title: "Match Rate"
    category: o2c_kpi

  - query_variants:
      - "revenue leakage"
      - "leakage rate"
      - "revenue leakage percent"
      - "how much revenue is leaking"
    entity: O2C_KPI_Snapshot
    fields: [leakage_rate]
    orderBy: "processed_at DESC"
    limit: 1
    panel_type: kpi-card
    title: "Revenue Leakage"
    category: o2c_kpi

  - query_variants:
      - "open accounts receivable"
      - "total open AR"
      - "outstanding AR balance"
      - "open AR amount"
      - "how much AR is open"
    entity: O2C_KPI_Snapshot
    fields: [total_open_ar]
    orderBy: "processed_at DESC"
    limit: 1
    panel_type: kpi-card
    title: "Total Open AR"
    category: o2c_kpi

  - query_variants:
      - "AR at risk"
      - "at risk amount"
      - "overdue AR amount"
      - "how much AR is at risk"
    entity: O2C_KPI_Snapshot
    fields: [at_risk_amount]
    orderBy: "processed_at DESC"
    limit: 1
    panel_type: kpi-card
    title: "AR at Risk"
    category: o2c_kpi

  # ─── O2C_Order_Result ────────────────────────────────────────────────
  - query_variants:
      - "order match status breakdown"
      - "orders by match status"
      - "match status distribution"
      - "how are orders matching"
    entity: O2C_Order_Result
    fields: [match_status]
    aggregation: {function: count, field: null}
    groupBy: [match_status]
    orderBy: "value DESC"
    limit: 1000
    panel_type: pie-chart
    title: "Order Match Status"
    category: o2c_orders

  - query_variants:
      - "top anomaly scores"
      - "highest anomaly orders"
      - "most anomalous orders"
      - "orders with highest anomaly"
      - "top 15 anomalous orders"
    entity: O2C_Order_Result
    fields: [opportunity_id, anomaly_score]
    orderBy: "anomaly_score DESC"
    limit: 15
    panel_type: bar-chart
    title: "Top Anomaly Scores"
    category: o2c_risk

  - query_variants:
      - "top risk orders"
      - "highest risk orders"
      - "riskiest orders"
      - "top orders by risk rank"
      - "orders ranked by risk"
    entity: O2C_Order_Result
    fields: [opportunity_id, account_name, order_amount, match_status, anomaly_score, risk_rank]
    orderBy: "risk_rank ASC"
    limit: 20
    panel_type: table
    title: "Top Risk Orders"
    category: o2c_risk

  - query_variants:
      - "top 10 orders by composite risk"
      - "top 10 risky orders"
      - "highest composite risk orders"
    entity: O2C_Order_Result
    fields: [opportunity_id, account_name, composite_risk, order_amount]
    orderBy: "composite_risk DESC"
    limit: 10
    panel_type: bar-chart
    title: "Top 10 Orders by Risk"
    category: o2c_risk

  - query_variants:
      - "total order amount by account tier"
      - "order revenue by tier"
      - "sales by tier"
      - "order amount per tier"
    entity: O2C_Order_Result
    fields: [account_tier, order_amount]
    aggregation: {function: sum, field: order_amount}
    groupBy: [account_tier]
    orderBy: "value DESC"
    panel_type: bar-chart
    title: "Order Amount by Account Tier"
    category: o2c_revenue

  - query_variants:
      - "average anomaly score by tier"
      - "mean anomaly per account tier"
      - "tier wise anomaly averages"
    entity: O2C_Order_Result
    fields: [account_tier, anomaly_score]
    aggregation: {function: avg, field: anomaly_score}
    groupBy: [account_tier]
    orderBy: "value DESC"
    panel_type: bar-chart
    title: "Average Anomaly Score by Tier"
    category: o2c_risk

  # ─── O2C_Alert ───────────────────────────────────────────────────────
  - query_variants:
      - "active O2C alerts"
      - "current order to cash alerts"
      - "all O2C alerts"
      - "recent O2C alerts"
    entity: O2C_Alert
    fields: [job_id, processed_at, total_alerts, alerts]
    orderBy: "processed_at DESC"
    limit: 20
    panel_type: alert-list
    title: "Active Alerts"
    category: o2c_alerts

  - query_variants:
      - "total O2C alerts over time"
      - "alert count over time"
      - "alert volume trend"
      - "how alerts have grown"
    entity: O2C_Alert
    fields: [processed_at, total_alerts]
    aggregation: {function: sum, field: total_alerts}
    groupBy: [processed_at]
    orderBy: "processed_at ASC"
    limit: 200
    panel_type: time-series
    title: "Total Alerts Over Time"
    category: o2c_alerts

  # ─── O2C_Action_Log ──────────────────────────────────────────────────
  - query_variants:
      - "O2C actions by type"
      - "action breakdown by type"
      - "what actions were taken"
      - "actions per category"
    entity: O2C_Action_Log
    fields: [action_type]
    aggregation: {function: count, field: null}
    groupBy: [action_type]
    orderBy: "value DESC"
    limit: 1000
    panel_type: pie-chart
    title: "Actions by Type"
    category: o2c_actions

  - query_variants:
      - "recent O2C actions"
      - "latest workflow actions"
      - "last 15 actions executed"
      - "newest action log entries"
    entity: O2C_Action_Log
    fields: [action_type, entity_type, entity_id, status, policy_reference]
    orderBy: "processed_at DESC"
    limit: 15
    panel_type: table
    title: "Recent Actions"
    category: o2c_actions

  - query_variants:
      - "credit holds executed"
      - "all credit hold actions"
      - "accounts placed on credit hold"
    entity: O2C_Action_Log
    fields: [action_id, entity_id, status, processed_at]
    filters:
      - {field: action_type, operator: eq, value: credit_hold}
    orderBy: "processed_at DESC"
    limit: 50
    panel_type: table
    title: "Credit Hold Actions"
    category: o2c_actions

  # ════════════════════════════════════════════════════════════════════

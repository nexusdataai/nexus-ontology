# Supply Chain Enterprise Schema Overlay
# SCOR (Supply Chain Operations Reference) and GS1 aligned semantic model
# for beverage supply chain operations across Salesforce CRM, SAP S/4HANA,
# Oracle ERP (Finance & Operations), and unstructured data sources.
#
# Standards:
#   SCOR — Plan | Source | Make | Deliver | Return | Enable
#   GS1  — GTIN (product), GLN (location), SSCC (shipment), Batch/Lot (traceability)

domains:
  # ─── Domain 1: Customer & Channel Management ─────────────────────
  - name: Customer & Channel Management
    system: Salesforce
    scor_process: Deliver/Plan
    description: Customer, distributor, and retailer identity, channel classification, and trade marketing
    tables:
      - fdw_table: Account
        semantic: "Customer/distributor/retailer master — drives demand signals, credit decisions, and fulfillment routing"
        risk_level: high
        key_fields:
          - name: Account_ID
            semantic: "Unique customer identifier"
            data_type: ID
          - name: Name
            semantic: "Legal business name of the customer"
            data_type: Text
          - name: Channel_Type
            semantic: "Distribution channel classification"
            data_type: Picklist
            constraints:
              - "Values: Modern_Trade, General_Trade, HORECA, E-commerce, Institutional"
              - "Determines pricing tier and fulfillment SLA"
          - name: Region
            semantic: "Geographic sales region"
            data_type: Text
          - name: Tier
            semantic: "Strategic importance tier"
            data_type: Picklist
            constraints:
              - "Values: Platinum, Gold, Silver, Bronze"
              - "Drives service level and retention priority"
          - name: Credit_Limit
            semantic: "Maximum allowable credit exposure"
            data_type: Currency
            risk_level: high
            constraints:
              - "Max value 5,000,000 USD"
              - "Increases above 10% require Finance Manager approval"
          - name: Payment_Terms
            semantic: "Agreed payment terms in days"
            data_type: Text
          - name: Status
            semantic: "Account lifecycle status"
            data_type: Picklist
            constraints:
              - "Values: Active, Inactive, Suspended, On_Credit_Hold"
              - "Deactivation requires zero AR balance in Oracle"
          - name: Owner_ID
            semantic: "Assigned sales representative"
            data_type: Lookup
        relationships:
          - type: syncs_to
            target_entity: AR_Customer
            target_category: schema
            target_system: Oracle
            description: "Account data syncs to Oracle AR for billing and collections"
          - type: syncs_to
            target_entity: sf-oracle-supply-chain-sync
            target_category: integration
            description: "Account synced via Salesforce-Oracle integration"
          - type: triggers
            target_entity: Customer Churn Prediction
            target_category: workflow
            description: "Volume decline triggers churn prediction workflow"
          - type: constrained_by
            target_entity: pricing-discount-policy
            target_category: policy
            description: "Pricing and discount limits governed by policy"
          - type: triggers
            target_entity: Customer Risk Assessment
            target_category: workflow
            description: "Risk tier changes trigger risk assessment workflow"

      - fdw_table: Contact
        semantic: "Customer contact persons linked to accounts"
        risk_level: medium
        key_fields:
          - name: Contact_ID
            semantic: "Unique contact identifier"
            data_type: ID
          - name: Account_ID
            semantic: "Parent account reference"
            data_type: Lookup
          - name: Name
            semantic: "Full name of contact"
            data_type: Text
          - name: Email
            semantic: "Primary business email"
            data_type: Email
          - name: Phone
            semantic: "Primary phone number"
            data_type: Phone
          - name: Role
            semantic: "Functional role at the customer organization"
            data_type: Picklist
            constraints:
              - "Values: Buyer, Finance, Logistics, Decision_Maker, Influencer"
          - name: Primary_Flag
            semantic: "Whether this is the primary contact for the account"
            data_type: Boolean
        relationships:
          - type: depends_on
            target_entity: Account
            target_category: schema
            description: "Contact belongs to an Account"

      - fdw_table: Campaign
        semantic: "Promotion and trade marketing programs driving demand lift"
        risk_level: medium
        key_fields:
          - name: Campaign_ID
            semantic: "Unique campaign identifier"
            data_type: ID
          - name: Name
            semantic: "Campaign name"
            data_type: Text
          - name: Type
            semantic: "Promotion mechanic type"
            data_type: Picklist
            constraints:
              - "Values: Discount, BOGO, Bundle, Display, Sampling"
          - name: Start_Date
            semantic: "Campaign start date"
            data_type: Date
          - name: End_Date
            semantic: "Campaign end date"
            data_type: Date
          - name: Budget
            semantic: "Allocated campaign budget"
            data_type: Currency
          - name: Target_Segment
            semantic: "Targeted customer segment or channel"
            data_type: Text
          - name: Status
            semantic: "Campaign lifecycle status"
            data_type: Picklist
        relationships:
          - type: triggers
            target_entity: Demand Forecast Generation
            target_category: workflow
            description: "Promotions trigger forecast recalculation for affected SKUs"
          - type: constrained_by
            target_entity: pricing-discount-policy
            target_category: policy
            description: "Promotion mechanics governed by pricing policy"

      - fdw_table: Lead
        semantic: "Sales leads — potential customers not yet converted"
        risk_level: medium
        key_fields:
          - name: Status
            semantic: "Lead lifecycle status"
            data_type: Picklist
          - name: Company
            semantic: "Prospective company name"
            data_type: Text
          - name: ConvertedAccountId
            semantic: "Account created upon lead conversion"
            data_type: Lookup
        relationships:
          - type: triggers
            target_entity: B2B Customer Onboarding
            target_category: workflow
            description: "Lead conversion triggers customer onboarding"

  # ─── Domain 2: Sales & Demand Signals ────────────────────────────
  - name: Sales & Demand Signals
    system: Salesforce
    scor_process: Plan/Deliver
    description: Sales orders and demand signals feeding forecasting and fulfillment
    tables:
      - fdw_table: Opportunity
        semantic: "Sales order / demand signal — tracks deals from qualification to fulfillment"
        risk_level: medium
        key_fields:
          - name: Opportunity_ID
            semantic: "Unique opportunity/order identifier"
            data_type: ID
          - name: Account_ID
            semantic: "Related customer account"
            data_type: Lookup
          - name: Total_Value
            semantic: "Total order value in base currency"
            data_type: Currency
          - name: Stage
            semantic: "Sales stage in pipeline"
            data_type: Picklist
            constraints:
              - "Values: Prospect, Negotiation, Closed_Won, Closed_Lost, Fulfilled"
          - name: Close_Date
            semantic: "Expected or actual close date"
            data_type: Date
          - name: Delivery_Date
            semantic: "Requested delivery date"
            data_type: Date
          - name: Region
            semantic: "Order geographic region"
            data_type: Text
        relationships:
          - type: depends_on
            target_entity: Account
            target_category: schema
            description: "Order linked to customer account"
          - type: triggers
            target_entity: Order-to-Cash Monitoring
            target_category: workflow
            description: "Closed-Won order triggers O2C monitoring"
          - type: triggers
            target_entity: Demand Forecast Generation
            target_category: workflow
            description: "Order history feeds demand forecasting"
          - type: syncs_to
            target_entity: sf-sap-demand-sync
            target_category: integration
            description: "Orders synced to SAP as demand signals"
          - type: constrained_by
            target_entity: order-fulfillment-policy
            target_category: policy
            description: "Order SLA governed by fulfillment policy"

      - fdw_table: Opportunity_Line_Item
        semantic: "Individual SKU line within a sales order — granular demand signal"
        risk_level: medium
        key_fields:
          - name: Line_ID
            semantic: "Unique line item identifier"
            data_type: ID
          - name: Opportunity_ID
            semantic: "Parent order reference"
            data_type: Lookup
          - name: Product_ID
            semantic: "Product reference — maps to SAP Material_Master via integration"
            data_type: Lookup
          - name: Quantity
            semantic: "Ordered quantity in sales units"
            data_type: Number
          - name: Unit_Price
            semantic: "Selling price per unit"
            data_type: Currency
          - name: Discount_Pct
            semantic: "Applied discount percentage"
            data_type: Percent
            constraints:
              - "Must not exceed channel-tier max per pricing-discount-policy"
          - name: Delivery_Priority
            semantic: "Fulfillment priority"
            data_type: Picklist
            constraints:
              - "Values: Standard, Express, Critical"
        relationships:
          - type: depends_on
            target_entity: Opportunity
            target_category: schema
            description: "Line item belongs to an order"
          - type: depends_on
            target_entity: Material_Master
            target_category: schema
            target_system: SAP
            description: "Product_ID resolves to SAP Material_Master via ontology"

      - fdw_table: Forecast_Override
        semantic: "Sales team manual forecast adjustments overlaid on AI predictions"
        risk_level: low
        key_fields:
          - name: Override_ID
            semantic: "Unique override identifier"
            data_type: ID
          - name: Product_ID
            semantic: "Product/SKU being overridden"
            data_type: Lookup
          - name: Region
            semantic: "Geographic region of override"
            data_type: Text
          - name: Period
            semantic: "Forecast period (week/month)"
            data_type: Text
          - name: Override_Qty
            semantic: "Manual quantity override"
            data_type: Number
          - name: Justification
            semantic: "Business reason for override"
            data_type: Text
          - name: Submitted_By
            semantic: "Sales rep who submitted the override"
            data_type: Lookup
        relationships:
          - type: depends_on
            target_entity: Material_Master
            target_category: schema
            target_system: SAP
            description: "Override references a specific product/SKU"

  # ─── Domain 3: Material & Product Master ─────────────────────────
  - name: Material & Product Master
    system: SAP
    scor_process: Enable
    gs1_standard: "GTIN for product identification"
    description: Central product/SKU master data — the most connected entity in supply chain
    tables:
      - fdw_table: Material_Master
        virtual: true
        semantic: "Central product/SKU master (SAP MARA) — single source of truth linking procurement, production, inventory, sales, quality, and finance"
        risk_level: high
        key_fields:
          - name: Material_ID
            semantic: "Unique material number — primary key across all SAP modules"
            data_type: Text
          - name: GTIN
            semantic: "GS1 Global Trade Item Number for external identification"
            data_type: Text
          - name: Description
            semantic: "Material description"
            data_type: Text
          - name: Category
            semantic: "Product category"
            data_type: Picklist
            constraints:
              - "Values: Carbonated, Juice, Water, Energy, Sports, Snacks, Tea"
          - name: Sub_Category
            semantic: "Product sub-category"
            data_type: Text
          - name: Brand
            semantic: "Brand name"
            data_type: Text
          - name: Pack_Size
            semantic: "Individual unit size (e.g. 330ml, 500ml, 1L, 2L)"
            data_type: Text
          - name: Pack_Config
            semantic: "Multi-pack configuration (e.g. 6-pack, 12-pack, 24-case)"
            data_type: Text
          - name: Unit_of_Measure
            semantic: "Base unit of measure"
            data_type: Text
          - name: Shelf_Life_Days
            semantic: "Maximum shelf life from production date"
            data_type: Number
            constraints:
              - "Critical for expiry management and FIFO enforcement"
          - name: Weight_KG
            semantic: "Gross weight per unit in kilograms"
            data_type: Number
          - name: Volume_L
            semantic: "Volume per unit in liters"
            data_type: Number
          - name: Status
            semantic: "Material lifecycle status"
            data_type: Picklist
            constraints:
              - "Values: Active, Discontinued, Seasonal, New_Launch"
          - name: Recycled_Content_Pct
            semantic: "Percentage of recycled material in packaging"
            data_type: Percent
          - name: Recyclability_Score
            semantic: "Packaging recyclability rating (1-5)"
            data_type: Number
        relationships:
          - type: syncs_to
            target_entity: sf-sap-demand-sync
            target_category: integration
            description: "Product data mapped to Salesforce Product_ID"
          - type: constrained_by
            target_entity: sustainability-policy
            target_category: policy
            description: "Packaging attributes governed by sustainability targets"

      - fdw_table: Material_Plant
        virtual: true
        semantic: "Plant-level material settings (SAP MARC) — MRP, procurement, and production parameters per SKU per plant"
        risk_level: medium
        key_fields:
          - name: Material_ID
            semantic: "Material reference"
            data_type: Lookup
          - name: Plant_ID
            semantic: "Plant reference"
            data_type: Lookup
          - name: MRP_Type
            semantic: "MRP planning type"
            data_type: Picklist
          - name: Reorder_Point
            semantic: "Stock level triggering replenishment"
            data_type: Number
          - name: Safety_Stock
            semantic: "Minimum buffer stock level"
            data_type: Number
            constraints:
              - "Must comply with inventory-policy min days-of-supply"
          - name: Lead_Time_Days
            semantic: "Procurement or production lead time"
            data_type: Number
          - name: Lot_Size
            semantic: "Minimum order/production lot size"
            data_type: Number
          - name: Procurement_Type
            semantic: "How the material is sourced"
            data_type: Picklist
            constraints:
              - "Values: In_House_Production, External_Procurement"
          - name: ABC_Classification
            semantic: "Inventory value classification"
            data_type: Picklist
            constraints:
              - "Values: A (high value), B (medium), C (low)"
        relationships:
          - type: depends_on
            target_entity: Material_Master
            target_category: schema
            description: "Plant-level settings for a specific material"
          - type: depends_on
            target_entity: Plant_Master
            target_category: schema
            description: "Settings specific to a plant"
          - type: constrained_by
            target_entity: inventory-policy
            target_category: policy
            description: "Safety stock and reorder governed by inventory policy"

      - fdw_table: Material_Storage
        virtual: true
        semantic: "Storage-location-level stock information (SAP MARD)"
        risk_level: medium
        key_fields:
          - name: Material_ID
            semantic: "Material reference"
            data_type: Lookup
          - name: Plant_ID
            semantic: "Plant reference"
            data_type: Lookup
          - name: Storage_Location
            semantic: "Storage location within plant"
            data_type: Lookup
          - name: Unrestricted_Stock
            semantic: "Available stock quantity"
            data_type: Number
          - name: Blocked_Stock
            semantic: "Stock blocked for quality or other holds"
            data_type: Number
          - name: In_Quality_Stock
            semantic: "Stock under quality inspection"
            data_type: Number
        relationships:
          - type: depends_on
            target_entity: Material_Master
            target_category: schema
            description: "Stock for a specific material"

      - fdw_table: Bill_of_Materials
        virtual: true
        semantic: "Recipe/BOM — maps raw materials and packaging to finished goods with quantities"
        risk_level: medium
        key_fields:
          - name: BOM_ID
            semantic: "Unique BOM identifier"
            data_type: ID
          - name: Finished_Material_ID
            semantic: "Finished good material reference"
            data_type: Lookup
          - name: Component_Material_ID
            semantic: "Raw material or packaging component"
            data_type: Lookup
          - name: Component_Qty
            semantic: "Required quantity per unit of finished good"
            data_type: Number
          - name: Unit_of_Measure
            semantic: "Component unit"
            data_type: Text
          - name: Scrap_Pct
            semantic: "Expected scrap/waste percentage"
            data_type: Percent
          - name: Valid_From
            semantic: "BOM effectivity start date"
            data_type: Date
          - name: Valid_To
            semantic: "BOM effectivity end date"
            data_type: Date
        relationships:
          - type: depends_on
            target_entity: Material_Master
            target_category: schema
            description: "BOM links finished goods to component materials"

      - fdw_table: cspmb__Price_Item__c
        semantic: "Commercial product offering with pricing configuration"
        risk_level: medium
        key_fields:
          - name: Name
            semantic: "Product offering name"
            data_type: Text
          - name: cspmb__Recurring_Charge__c
            semantic: "Monthly recurring charge"
            data_type: Currency
          - name: cspmb__One_Off_Charge__c
            semantic: "One-time setup charge"
            data_type: Currency
        relationships:
          - type: syncs_to
            target_entity: Product_Master
            target_category: schema
            target_system: Oracle
            description: "Product data syncs to Oracle product master"

  # ─── Domain 4: Inventory & Warehouse ─────────────────────────────
  - name: Inventory & Warehouse
    system: SAP
    scor_process: Plan/Deliver
    gs1_standard: "Batch/Lot identification for traceability"
    description: Stock positions, batch management, warehouse locations, and inter-plant transfers
    tables:
      - fdw_table: Inventory_Position
        virtual: true
        semantic: "Real-time stock position per material x plant x storage location x batch"
        risk_level: high
        key_fields:
          - name: Material_ID
            semantic: "Material reference"
            data_type: Lookup
          - name: Plant_ID
            semantic: "Plant/warehouse reference"
            data_type: Lookup
          - name: Storage_Location
            semantic: "Storage location within plant"
            data_type: Lookup
          - name: Batch_ID
            semantic: "Batch/lot reference for traceability"
            data_type: Lookup
          - name: Unrestricted_Qty
            semantic: "Available-to-promise stock quantity"
            data_type: Number
          - name: Reserved_Qty
            semantic: "Stock reserved for open orders"
            data_type: Number
          - name: In_Transit_Qty
            semantic: "Stock in transit between locations"
            data_type: Number
          - name: Blocked_Qty
            semantic: "Stock blocked (quality hold, damaged)"
            data_type: Number
          - name: Valuation_Price
            semantic: "Stock valuation price per unit"
            data_type: Currency
          - name: Last_Count_Date
            semantic: "Date of last physical inventory count"
            data_type: Date
        relationships:
          - type: depends_on
            target_entity: Material_Master
            target_category: schema
            description: "Stock for a specific material"
          - type: depends_on
            target_entity: Batch_Master
            target_category: schema
            description: "Stock tracked at batch level"
          - type: triggers
            target_entity: Inventory Rebalancing
            target_category: workflow
            description: "Imbalances trigger rebalancing workflow"
          - type: constrained_by
            target_entity: inventory-policy
            target_category: policy
            description: "Stock levels governed by inventory policy"

      - fdw_table: Batch_Master
        virtual: true
        semantic: "Batch/lot-level tracking — critical for traceability, expiry management, and recall"
        risk_level: high
        key_fields:
          - name: Batch_ID
            semantic: "Unique batch/lot identifier (GS1 Batch/Lot)"
            data_type: Text
          - name: Material_ID
            semantic: "Material reference"
            data_type: Lookup
          - name: Production_Date
            semantic: "Date of manufacture"
            data_type: Date
          - name: Expiry_Date
            semantic: "Best-before / use-by date"
            data_type: Date
          - name: Shelf_Life_Remaining_Days
            semantic: "Calculated days until expiry"
            data_type: Number
          - name: Status
            semantic: "Batch availability status"
            data_type: Picklist
            constraints:
              - "Values: Unrestricted, Restricted, Blocked, In_Quality"
              - "Blocked batches cannot be shipped or sold"
          - name: Production_Order_ID
            semantic: "Production order that created this batch"
            data_type: Lookup
          - name: Plant_ID
            semantic: "Plant where batch was produced"
            data_type: Lookup
        relationships:
          - type: depends_on
            target_entity: Material_Master
            target_category: schema
            description: "Batch belongs to a material/SKU"
          - type: depends_on
            target_entity: Production_Order
            target_category: schema
            description: "Batch created by a production order"
          - type: triggers
            target_entity: Expiry Management
            target_category: workflow
            description: "Near-expiry batches trigger expiry management"
          - type: constrained_by
            target_entity: inventory-policy
            target_category: policy
            description: "Expiry actions governed by inventory policy"
          - type: constrained_by
            target_entity: quality-policy
            target_category: policy
            description: "Batch hold/release governed by quality policy"

      - fdw_table: Plant_Master
        virtual: true
        semantic: "Manufacturing plant and distribution center master (GS1 GLN for location identification)"
        risk_level: medium
        key_fields:
          - name: Plant_ID
            semantic: "Unique plant identifier"
            data_type: Text
          - name: GLN
            semantic: "GS1 Global Location Number"
            data_type: Text
          - name: Name
            semantic: "Plant name"
            data_type: Text
          - name: Type
            semantic: "Facility type"
            data_type: Picklist
            constraints:
              - "Values: Manufacturing, Distribution_Center, Depot, Co_Packer"
          - name: Location_Lat
            semantic: "Latitude coordinate"
            data_type: Number
          - name: Location_Long
            semantic: "Longitude coordinate"
            data_type: Number
          - name: Address
            semantic: "Full address"
            data_type: Text
          - name: Capacity_Units_Per_Day
            semantic: "Maximum daily production/throughput capacity"
            data_type: Number
          - name: Operating_Shifts
            semantic: "Number of operating shifts per day"
            data_type: Number
          - name: Status
            semantic: "Plant operational status"
            data_type: Picklist
        relationships:
          - type: triggers
            target_entity: ESG Reporting
            target_category: workflow
            description: "Plant-level data feeds ESG reporting"
          - type: constrained_by
            target_entity: sustainability-policy
            target_category: policy
            description: "Energy and water targets per plant"

      - fdw_table: Storage_Location
        virtual: true
        semantic: "Sub-divisions within a plant — typed by storage conditions"
        risk_level: low
        key_fields:
          - name: Storage_Location_ID
            semantic: "Unique storage location identifier"
            data_type: Text
          - name: Plant_ID
            semantic: "Parent plant"
            data_type: Lookup
          - name: Type
            semantic: "Storage area type"
            data_type: Picklist
            constraints:
              - "Values: Raw_Material, WIP, Finished_Goods, Cold_Chain, Quarantine"
          - name: Capacity
            semantic: "Maximum storage capacity in base units"
            data_type: Number
          - name: Temperature_Controlled
            semantic: "Whether location requires temperature monitoring"
            data_type: Boolean
        relationships:
          - type: depends_on
            target_entity: Plant_Master
            target_category: schema
            description: "Storage location within a plant"

      - fdw_table: Warehouse_Transfer
        virtual: true
        semantic: "Inter-warehouse stock movement orders for rebalancing"
        risk_level: medium
        key_fields:
          - name: Transfer_ID
            semantic: "Unique transfer order identifier"
            data_type: ID
          - name: From_Plant
            semantic: "Source plant/warehouse"
            data_type: Lookup
          - name: To_Plant
            semantic: "Destination plant/warehouse"
            data_type: Lookup
          - name: Material_ID
            semantic: "Material being transferred"
            data_type: Lookup
          - name: Batch_ID
            semantic: "Specific batch being transferred"
            data_type: Lookup
          - name: Qty
            semantic: "Transfer quantity"
            data_type: Number
          - name: Status
            semantic: "Transfer status"
            data_type: Picklist
            constraints:
              - "Values: Planned, Approved, In_Transit, Received, Cancelled"
          - name: Ship_Date
            semantic: "Actual or planned ship date"
            data_type: Date
          - name: ETA
            semantic: "Estimated arrival date"
            data_type: Date
        relationships:
          - type: depends_on
            target_entity: Plant_Master
            target_category: schema
            description: "Transfer between two plants"
          - type: constrained_by
            target_entity: inventory-policy
            target_category: policy
            description: "Transfer thresholds governed by inventory policy"

  # ─── Domain 5: Production & Quality ──────────────────────────────
  - name: Production & Quality
    system: SAP
    scor_process: Make
    description: Manufacturing work orders, production lines, quality inspections, and test results
    tables:
      - fdw_table: Production_Order
        virtual: true
        semantic: "Manufacturing work order — schedules production of finished goods from raw materials"
        risk_level: high
        key_fields:
          - name: Order_ID
            semantic: "Unique production order identifier"
            data_type: ID
          - name: Material_ID
            semantic: "Finished good being produced"
            data_type: Lookup
          - name: Plant_ID
            semantic: "Manufacturing plant"
            data_type: Lookup
          - name: Qty_Planned
            semantic: "Planned production quantity"
            data_type: Number
          - name: Qty_Produced
            semantic: "Actual confirmed quantity"
            data_type: Number
          - name: Qty_Scrapped
            semantic: "Quantity scrapped/wasted"
            data_type: Number
          - name: Production_Line
            semantic: "Assigned production line"
            data_type: Lookup
          - name: Shift
            semantic: "Production shift"
            data_type: Text
          - name: Start_Date
            semantic: "Scheduled/actual start"
            data_type: Date
          - name: End_Date
            semantic: "Scheduled/actual end"
            data_type: Date
          - name: Status
            semantic: "Order lifecycle status"
            data_type: Picklist
            constraints:
              - "Values: Planned, Released, In_Progress, Confirmed, Closed"
          - name: Yield_Pct

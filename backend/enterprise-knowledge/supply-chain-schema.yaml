            target_category: schema
            description: "Requisition for a specific material"
          - type: constrained_by
            target_entity: procurement-policy
            target_category: policy
            description: "Approval thresholds governed by procurement policy"

      - fdw_table: Goods_Receipt
        virtual: true
        semantic: "Inbound material receipt against a purchase order — triggers three-way match"

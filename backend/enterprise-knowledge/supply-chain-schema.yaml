          - type: depends_on
            target_entity: Material_Master
            target_category: schema
            description: "Source list links material to vendor"
          - type: constrained_by
            target_entity: supply-chain-risk-policy
            target_category: policy
            description: "Single-source prohibition for critical materials"

      - fdw_table: Purchase_Requisition
        virtual: true

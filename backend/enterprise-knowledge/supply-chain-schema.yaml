        physical_source_table: Oracle_AP_Invoice
        virtual: true
        semantic: "Vendor invoice for goods/services received — subject to three-way match"
        risk_level: high
        key_fields:
          - name: Invoice_ID
            semantic: "Unique AP invoice identifier"
            data_type: ID
          - name: Vendor_ID
            semantic: "Invoicing vendor"
            data_type: Lookup
          - name: PO_ID
            semantic: "Related purchase order"
            data_type: Lookup
          - name: Invoice_Date
            semantic: "Invoice date"

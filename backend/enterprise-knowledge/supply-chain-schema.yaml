          - type: triggers
            target_entity: Quality Deviation Response
            target_category: workflow
            description: "Failed inspection triggers quality deviation workflow"
          - type: constrained_by
            target_entity: quality-policy
            target_category: policy
            description: "Inspection criteria and hold rules governed by quality policy"

      - fdw_table: Quality_Test_Result
        virtual: true
        semantic: "Individual test measurement within an inspection — compared against spec limits"
        risk_level: high
        key_fields:
          - name: Result_ID
            semantic: "Unique test result identifier"
            data_type: ID
          - name: Inspection_ID

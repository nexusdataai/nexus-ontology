  # ─── Domain 13: Commercial Configure/Quote (Sell-Side CPQ) ───────
  - name: Commercial Configure/Quote
    system: TPM_Simulator
    scor_process: Plan/Deliver
    description: Trade CPQ — configure offerings, price by channel/tier, quote trade customers (Modern Trade, General Trade, HORECA, E-commerce). Sell-side CPQ overlay that joins Material_Master, Account, Campaign, Cost_Accounting via foreign keys.
    tables:
      - fdw_table: Product_Offering
        virtual: true
        semantic: "Sellable bundle, single SKU, listing pack, or promo pack assembled from Material_Master. TMF620-equivalent product offering for trade sales."
        risk_level: medium
        key_fields:
          - name: Offering_ID
            semantic: "Unique offering identifier"
            data_type: ID
          - name: Name
            semantic: "Offering display name"
            data_type: Text
          - name: Type
            semantic: "Offering composition type"
            data_type: Picklist
            constraints:
              - "Values: Single_SKU, Multi_SKU_Bundle, Listing_Pack, Promo_Pack"
          - name: Channel_Eligibility
            semantic: "Allowed channels (comma-separated)"
            data_type: Text
            constraints:
              - "Values from Modern_Trade, General_Trade, HORECA, E-commerce, Institutional"
          - name: Region_Eligibility
            semantic: "Allowed regions (comma-separated)"
            data_type: Text
          - name: Status
            semantic: "Offering lifecycle status"
            data_type: Picklist
            constraints:
              - "Values: Draft, Active, Retired"
          - name: Owner_ID
            semantic: "Commercial owner"
            data_type: Lookup
          - name: Valid_From
            semantic: "Validity window start"
            data_type: Date
          - name: Valid_To
            semantic: "Validity window end"
            data_type: Date
        relationships:
          - type: depends_on
            target_entity: Material_Master
            target_category: schema
            description: "Offerings are composed of one or more Material_Master SKUs via Offering_Component"
          - type: constrained_by
            target_entity: cpq-configuration-policy
            target_category: policy
            description: "Channel/region eligibility and pack/case rules enforced by CPQ configuration policy"

      - fdw_table: Offering_Component
        virtual: true
        semantic: "A SKU line inside a Product_Offering (anchor, add-on, or free good). Drives the BOM-like structure of bundles and promo packs."
        risk_level: medium
        key_fields:
          - name: Component_ID
            semantic: "Unique component line identifier"
            data_type: ID
          - name: Offering_ID
            semantic: "Parent offering"
            data_type: Lookup
          - name: Material_ID
            semantic: "Material/SKU included"
            data_type: Lookup
          - name: Qty
            semantic: "Quantity of this material per offering unit"
            data_type: Number
          - name: Component_Role
            semantic: "Role of this component in the offering"
            data_type: Picklist
            constraints:
              - "Values: Anchor, Add_On, Free_Good"
          - name: Substitutable_Flag
            semantic: "Whether substitution is allowed for this line"
            data_type: Boolean
        relationships:
          - type: depends_on
            target_entity: Product_Offering
            target_category: schema
            description: "Components belong to one Product_Offering"
          - type: depends_on
            target_entity: Material_Master
            target_category: schema
            description: "Each component points to one Material_Master SKU"

      - fdw_table: Price_Book
        virtual: true
        semantic: "Channel × tier × region price book header. Defines a pricing scope and validity window."
        risk_level: high
        key_fields:
          - name: Price_Book_ID
            semantic: "Unique price book identifier"
            data_type: ID
          - name: Name
            semantic: "Price book name"
            data_type: Text
          - name: Channel_Type
            semantic: "Distribution channel scope"
            data_type: Picklist
            constraints:
              - "Values: Modern_Trade, General_Trade, HORECA, E-commerce, Institutional"
          - name: Tier
            semantic: "Customer tier scope"
            data_type: Picklist
            constraints:
              - "Values: Platinum, Gold, Silver, Bronze, All"
          - name: Region
            semantic: "Geographic scope"
            data_type: Text
          - name: Currency
            semantic: "Price book currency (ISO 4217)"
            data_type: Text
          - name: Valid_From
            semantic: "Validity window start"
            data_type: Date
          - name: Valid_To
            semantic: "Validity window end"
            data_type: Date
          - name: Status
            semantic: "Price book lifecycle status"
            data_type: Picklist
            constraints:
              - "Values: Draft, Active, Archived"
        relationships:
          - type: constrained_by
            target_entity: pricing-discount-policy
            target_category: policy
            description: "Tier caps and channel limits per pricing & discount policy"

      - fdw_table: Price_Book_Entry
        virtual: true
        semantic: "Per-offering list price, floor price, and cost snapshot within a price book. Drives quote pricing waterfall."
        risk_level: high
        key_fields:
          - name: Entry_ID
            semantic: "Unique price book entry identifier"
            data_type: ID
          - name: Price_Book_ID
            semantic: "Parent price book"
            data_type: Lookup
          - name: Offering_ID
            semantic: "Offering being priced"
            data_type: Lookup
          - name: List_Price
            semantic: "Catalog list price (per offering unit)"
            data_type: Currency
          - name: Floor_Price
            semantic: "Minimum sellable price (margin floor)"
            data_type: Currency
            risk_level: high
          - name: Cost_Snapshot
            semantic: "Snapshot unit cost used for margin calculations"
            data_type: Currency
        relationships:
          - type: depends_on
            target_entity: Price_Book
            target_category: schema
            description: "Entries belong to one Price_Book"
          - type: depends_on
            target_entity: Product_Offering
            target_category: schema
            description: "Each entry prices one Product_Offering"
          - type: constrained_by
            target_entity: pricing-discount-policy
            target_category: policy
            description: "Floor price enforces margin policy"

      - fdw_table: Quote_Header
        virtual: true
        semantic: "Trade quote header — precursor to a Salesforce Opportunity. Captures customer, status, totals, validity, and the approval chain."
        risk_level: high
        key_fields:
          - name: Quote_ID
            semantic: "Unique quote identifier"
            data_type: ID
          - name: Account_ID
            semantic: "Customer/distributor being quoted"
            data_type: Lookup
          - name: Owner_ID
            semantic: "Sales rep owning the quote"
            data_type: Lookup
          - name: Status
            semantic: "Quote lifecycle status"
            data_type: Picklist
            constraints:
              - "Values: Draft, In_Review, Approved, Rejected, Won_Converted, Expired"
              - "Transition to Won_Converted triggers quote-to-order workflow"
          - name: Validity_Date
            semantic: "Expiration date for the quoted prices"
            data_type: Date
          - name: Total_Net
            semantic: "Net total after all discounts and promotions"
            data_type: Currency
          - name: Margin_Pct
            semantic: "Blended margin percentage across all lines"
            data_type: Percent
          - name: Discount_Pct
            semantic: "Blended discount percentage applied"
            data_type: Percent
          - name: Approval_Chain_JSON
            semantic: "Serialized approval chain with approver, role, status, timestamps"
            data_type: Text
          - name: Created_At
            semantic: "Quote creation timestamp"
            data_type: DateTime
          - name: Submitted_At
            semantic: "Submission for review timestamp"
            data_type: DateTime
        relationships:
          - type: depends_on
            target_entity: Account
            target_category: schema
            description: "Quote is for a specific customer Account"
          - type: triggers
            target_entity: Quote Approval Routing
            target_category: workflow
            description: "Submission triggers approval workflow"
          - type: triggers
            target_entity: Quote To Order
            target_category: workflow
            description: "Won_Converted triggers quote-to-order workflow"
          - type: syncs_to
            target_entity: Opportunity
            target_category: schema
            description: "Approved/won quote syncs to a Salesforce Opportunity"
          - type: constrained_by
            target_entity: pricing-discount-policy
            target_category: policy
            description: "Discount and trade spend caps"
          - type: constrained_by
            target_entity: cpq-quote-approval-policy
            target_category: policy
            description: "Approval matrix per discount and margin thresholds"

      - fdw_table: Quote_Line
        virtual: true
        semantic: "Line on a Quote_Header — references a Product_Offering with negotiated quantity, price, discount, and promo."
        risk_level: high
        key_fields:
          - name: Line_ID
            semantic: "Unique quote line identifier"
            data_type: ID
          - name: Quote_ID
            semantic: "Parent quote header"
            data_type: Lookup
          - name: Offering_ID
            semantic: "Offering quoted on this line"
            data_type: Lookup
          - name: Qty
            semantic: "Quantity of the offering"
            data_type: Number
          - name: Unit_Price
            semantic: "Negotiated unit price after channel/tier price book"
            data_type: Currency
          - name: Discount_Pct
            semantic: "Discount percentage applied to list price"
            data_type: Percent
          - name: Promotion_ID
            semantic: "Applied promotion (if any)"
            data_type: Lookup
          - name: Listing_Fee
            semantic: "One-time listing fee"
            data_type: Currency
          - name: Slotting_Fee
            semantic: "One-time slotting fee"
            data_type: Currency
          - name: Margin_Pct_Line
            semantic: "Margin percentage for this line"
            data_type: Percent
        relationships:
          - type: depends_on
            target_entity: Quote_Header
            target_category: schema
            description: "Line belongs to one Quote_Header"
          - type: depends_on
            target_entity: Product_Offering
            target_category: schema
            description: "Line references one Product_Offering"
          - type: constrained_by
            target_entity: cpq-configuration-policy
            target_category: policy
            description: "Line composition and MOQ validated by configuration policy"

      - fdw_table: Quote_Promotion
        virtual: true
        semantic: "An applied promotion overlay on a Quote_Header or Quote_Line — references a Campaign mechanic and tracks stacking group."
        risk_level: medium
        key_fields:
          - name: Promo_ID
            semantic: "Unique applied promotion identifier"
            data_type: ID
          - name: Quote_ID
            semantic: "Parent quote header"
            data_type: Lookup
          - name: Campaign_ID
            semantic: "Source Campaign"
            data_type: Lookup
          - name: Mechanic
            semantic: "Promotion mechanic"
            data_type: Picklist
            constraints:
              - "Values: Discount, BOGO, Bundle, Display, Sampling"
          - name: Value
            semantic: "Discount percentage or absolute value depending on mechanic"
            data_type: Number
          - name: Stacking_Group
            semantic: "Stacking group key — promos in the same group cannot stack"
            data_type: Text
        relationships:
          - type: depends_on
            target_entity: Quote_Header
            target_category: schema
            description: "Promotion belongs to one Quote_Header"
          - type: depends_on
            target_entity: Campaign
            target_category: schema
            description: "Promotion overlays a Campaign"
          - type: constrained_by
            target_entity: pricing-discount-policy
            target_category: policy
            description: "Stacking caps enforced by pricing & discount policy"

      - fdw_table: Serviceability_Footprint
        virtual: true
        semantic: "Plant/depot coverage per region × channel — defines whether an offering can be fulfilled to a customer location within SLA."
        risk_level: medium
        key_fields:
          - name: Footprint_ID
            semantic: "Unique footprint identifier"
            data_type: ID
          - name: Plant_ID
            semantic: "Serving plant or depot"
            data_type: Lookup
          - name: Region
            semantic: "Covered region"
            data_type: Text
          - name: Channel_Type
            semantic: "Channel covered"
            data_type: Picklist
            constraints:
              - "Values: Modern_Trade, General_Trade, HORECA, E-commerce, Institutional"
          - name: SLA_Days
            semantic: "Promised SLA in business days"
            data_type: Number
          - name: Min_Order_Qty
            semantic: "Minimum order quantity for this footprint"
            data_type: Number
        relationships:
          - type: depends_on
            target_entity: Plant_Master
            target_category: schema
            description: "Footprint is anchored to a Plant_Master"
          - type: constrained_by
            target_entity: order-fulfillment-policy
            target_category: policy
            description: "SLA aligned with order fulfillment policy"

      - fdw_table: Configuration_Rule
        virtual: true
        semantic: "Declarative validity rule for offerings, quotes, and channel eligibility — checked by configure_bundle and validate_configuration."
        risk_level: medium
        key_fields:
          - name: Rule_ID
            semantic: "Unique rule identifier"
            data_type: ID
          - name: Type
            semantic: "Rule type"
            data_type: Picklist
            constraints:
              - "Values: Compatibility, MOQ, Pack_Config, Exclusion, Required_Together, Channel_Eligibility, Region_Restriction"
          - name: Expression
            semantic: "DSL expression evaluated against quote context"
            data_type: Text
          - name: Severity
            semantic: "Violation severity"
            data_type: Picklist
            constraints:
              - "Values: Error, Warning, Info"
          - name: Description
            semantic: "Human-readable rule description"
            data_type: Text
        relationships:
          - type: constrained_by
            target_entity: cpq-configuration-policy
            target_category: policy
            description: "Rule library curated under CPQ configuration policy"

  # ─── Domain 14: Sourcing RFx/Award (Buy-Side CPQ) ────────────────
  - name: Sourcing RFx/Award
    system: Sourcing_Simulator
    scor_process: Source
    description: Sourcing CPQ — RFx events, vendor responses, should-cost models, and award scenarios for procurement (raw materials, packaging, co-pack, logistics). Buy-side CPQ overlay that joins Vendor_Master, Source_List, Material_Master, Plant_Master, Commodity_Price, Contract_Document.
    tables:
      - fdw_table: RFx_Event
        virtual: true
        semantic: "RFI/RFP/RFQ/Reverse Auction campaign header. Drives vendor solicitation, bid evaluation, and award decision."
        risk_level: high
        key_fields:
          - name: Event_ID
            semantic: "Unique RFx event identifier"
            data_type: ID
          - name: Type
            semantic: "RFx event type"
            data_type: Picklist
            constraints:
              - "Values: RFI, RFP, RFQ, Reverse_Auction"
          - name: Buyer_Plant_ID
            semantic: "Primary buyer plant"
            data_type: Lookup
          - name: Category
            semantic: "Spend category"
            data_type: Picklist
            constraints:
              - "Values: Raw_Material, Packaging, Co_Packer, Logistics, Services, Equipment"
          - name: Status
            semantic: "Event lifecycle status"
            data_type: Picklist
            constraints:
              - "Values: Draft, Published, Bidding, Evaluation, Awarded, Cancelled"
          - name: Open_Date
            semantic: "Bidding open date"
            data_type: Date
          - name: Close_Date
            semantic: "Bidding close date"
            data_type: Date
          - name: Owner_ID
            semantic: "Buyer/category manager owning the event"
            data_type: Lookup
          - name: Title
            semantic: "Event title"
            data_type: Text
        relationships:
          - type: depends_on
            target_entity: Plant_Master
            target_category: schema
            description: "Event is on behalf of a specific plant"
          - type: triggers
            target_entity: RFx Launch
            target_category: workflow
            description: "Event creation triggers RFx Launch workflow"
          - type: triggers
            target_entity: RFx Bid Evaluation
            target_category: workflow
            description: "Closing the bidding window triggers bid evaluation"
          - type: constrained_by
            target_entity: procurement-policy
            target_category: policy
            description: "Bidding, sole-source, and approval rules from procurement policy"
          - type: constrained_by
            target_entity: sourcing-award-policy
            target_category: policy
            description: "Award constraints from sourcing-award policy"

      - fdw_table: RFx_Line
        virtual: true
        semantic: "A line item being sourced in an RFx event — material/service, target quantity, plant, certification requirement, and incoterm."
        risk_level: medium
        key_fields:
          - name: Line_ID
            semantic: "Unique RFx line identifier"
            data_type: ID
          - name: Event_ID
            semantic: "Parent RFx event"
            data_type: Lookup
          - name: Material_ID
            semantic: "Material being sourced (nullable for service categories)"
            data_type: Lookup
          - name: Service_Code
            semantic: "Service code for non-material categories"
            data_type: Text
          - name: Qty_Target
            semantic: "Target quantity to source"
            data_type: Number
          - name: Plant_ID
            semantic: "Destination plant"
            data_type: Lookup
          - name: Required_Cert
            semantic: "Required vendor certifications (comma-separated)"
            data_type: Text
          - name: Incoterm
            semantic: "Incoterms 2020 (e.g. FOB, CIF, DAP, DDP)"
            data_type: Text
          - name: Currency
            semantic: "Target currency"
            data_type: Text
        relationships:
          - type: depends_on
            target_entity: RFx_Event
            target_category: schema
            description: "Line belongs to one RFx_Event"
          - type: depends_on
            target_entity: Material_Master
            target_category: schema
            description: "Line references a Material_Master SKU (when applicable)"
          - type: depends_on
            target_entity: Plant_Master
            target_category: schema
            description: "Line specifies destination plant"

      - fdw_table: RFx_Invitation
        virtual: true
        semantic: "Vendor invited to participate in an RFx event."
        risk_level: medium
        key_fields:
          - name: Invitation_ID
            semantic: "Unique invitation identifier"
            data_type: ID
          - name: Event_ID
            semantic: "RFx event"
            data_type: Lookup
          - name: Vendor_ID
            semantic: "Invited vendor"
            data_type: Lookup
          - name: Status
            semantic: "Invitation lifecycle status"
            data_type: Picklist
            constraints:
              - "Values: Invited, Accepted, Declined, Submitted, Withdrawn"
          - name: Invited_At
            semantic: "Invitation timestamp"
            data_type: DateTime
        relationships:
          - type: depends_on
            target_entity: RFx_Event
            target_category: schema
            description: "Invitation belongs to one RFx_Event"
          - type: depends_on
            target_entity: Vendor_Master
            target_category: schema
            description: "Invitation references a Vendor_Master"

      - fdw_table: Vendor_Quote
        virtual: true
        semantic: "Vendor's quote submission against an RFx event."
        risk_level: high
        key_fields:
          - name: Vendor_Quote_ID
            semantic: "Unique vendor quote identifier"
            data_type: ID
          - name: Event_ID
            semantic: "RFx event being responded to"
            data_type: Lookup
          - name: Vendor_ID
            semantic: "Responding vendor"
            data_type: Lookup
          - name: Submitted_At
            semantic: "Submission timestamp"
            data_type: DateTime
          - name: Total_Value
            semantic: "Total bid value"
            data_type: Currency
          - name: Validity_Date
            semantic: "Bid validity expiration"
            data_type: Date
          - name: Status
            semantic: "Quote lifecycle status"
            data_type: Picklist
            constraints:
              - "Values: Draft, Submitted, Under_Evaluation, Awarded, Rejected, Withdrawn"
        relationships:
          - type: depends_on
            target_entity: RFx_Event
            target_category: schema
            description: "Quote responds to one RFx_Event"
          - type: depends_on
            target_entity: Vendor_Master
            target_category: schema
            description: "Quote is from one Vendor_Master"
          - type: triggers
            target_entity: RFx Bid Evaluation
            target_category: workflow
            description: "Submission feeds bid evaluation"

      - fdw_table: Vendor_Quote_Line
        virtual: true
        semantic: "Per-line vendor pricing on a Vendor_Quote — unit price, lead time, MOQ, payment terms, tiered pricing, and compliance flags."
        risk_level: high
        key_fields:
          - name: Line_ID
            semantic: "Unique line identifier"
            data_type: ID
          - name: Vendor_Quote_ID
            semantic: "Parent vendor quote"
            data_type: Lookup
          - name: RFx_Line_ID
            semantic: "RFx line being responded to"
            data_type: Lookup
          - name: Unit_Price
            semantic: "Quoted unit price"
            data_type: Currency
          - name: Lead_Time_Days
            semantic: "Quoted lead time"
            data_type: Number
          - name: MOQ
            semantic: "Minimum order quantity"
            data_type: Number
          - name: Payment_Terms
            semantic: "Vendor payment terms (e.g. Net_30)"
            data_type: Text
          - name: Tiered_Pricing_JSON
            semantic: "Volume tier pricing as JSON list of {qty_threshold, unit_price}"
            data_type: Text
          - name: Compliance_Flags
            semantic: "Compliance flags (certs met, incoterm matched) as comma-separated tokens"
            data_type: Text
        relationships:
          - type: depends_on
            target_entity: Vendor_Quote
            target_category: schema
            description: "Line belongs to one Vendor_Quote"
          - type: depends_on
            target_entity: RFx_Line
            target_category: schema
            description: "Line responds to a specific RFx_Line"

      - fdw_table: Should_Cost_Model
        virtual: true
        semantic: "Bottom-up should-cost benchmark per material — combines commodity index, labor, overhead, freight."
        risk_level: medium
        key_fields:
          - name: Model_ID
            semantic: "Unique should-cost model identifier"
            data_type: ID
          - name: Material_ID
            semantic: "Material being modeled"
            data_type: Lookup
          - name: Commodity_Index_Refs
            semantic: "Comma-separated Commodity_Price refs feeding the model"
            data_type: Text
          - name: Labor_Index
            semantic: "Labor index value used"
            data_type: Number
          - name: Overhead
            semantic: "Overhead allocation per unit"
            data_type: Currency
          - name: Freight
            semantic: "Estimated freight per unit"
            data_type: Currency
          - name: Modeled_Cost
            semantic: "Final modeled should-cost per unit"
            data_type: Currency
          - name: Confidence
            semantic: "Model confidence (0-1)"
            data_type: Number
          - name: Generated_At
            semantic: "Model generation timestamp"
            data_type: DateTime
        relationships:
          - type: depends_on
            target_entity: Material_Master
            target_category: schema
            description: "Model is built for one Material_Master"
          - type: depends_on
            target_entity: Commodity_Price
            target_category: schema
            description: "Model consumes Commodity_Price feeds"

      - fdw_table: Sourcing_Scenario
        virtual: true
        semantic: "What-if award split scenario over an RFx event — modeled savings, risk, and concentration metrics for award decision support."
        risk_level: high
        key_fields:
          - name: Scenario_ID
            semantic: "Unique scenario identifier"
            data_type: ID
          - name: Event_ID
            semantic: "RFx event being scenarioed"
            data_type: Lookup
          - name: Name
            semantic: "Scenario name (e.g. 'Cost optimal', 'Risk balanced')"
            data_type: Text
          - name: Split_JSON
            semantic: "Award split as JSON list of {vendor_id, qty, price, plant_id}"
            data_type: Text
          - name: Modeled_Savings
            semantic: "Modeled savings vs should-cost"
            data_type: Currency
          - name: Modeled_Risk_Score
            semantic: "Composite risk score 0-100"
            data_type: Number
          - name: Concentration_Pct
            semantic: "Maximum share of award going to a single vendor"
            data_type: Percent
          - name: Generated_At
            semantic: "Scenario generation timestamp"
            data_type: DateTime
        relationships:
          - type: depends_on
            target_entity: RFx_Event
            target_category: schema
            description: "Scenario is for one RFx_Event"
          - type: constrained_by
            target_entity: sourcing-award-policy
            target_category: policy
            description: "Concentration ceiling and single-source rules enforced by policy"
          - type: constrained_by
            target_entity: supply-chain-risk-policy
            target_category: policy
            description: "Risk thresholds enforced by SC risk policy"

      - fdw_table: Sourcing_Award
        virtual: true
        semantic: "Approved sourcing award — finalizes a Sourcing_Scenario, drives Source_List updates, Contract_Document drafts, and Purchase_Order creation."
        risk_level: high
        key_fields:
          - name: Award_ID
            semantic: "Unique award identifier"
            data_type: ID
          - name: Event_ID
            semantic: "RFx event being awarded"
            data_type: Lookup
          - name: Scenario_ID
            semantic: "Selected scenario"
            data_type: Lookup
          - name: Status
            semantic: "Award lifecycle status"
            data_type: Picklist
            constraints:
              - "Values: Pending_Approval, Approved, Issued, Cancelled"
          - name: Approval_Chain_JSON
            semantic: "Serialized approval chain"
            data_type: Text
          - name: Approved_At
            semantic: "Final approval timestamp"
            data_type: DateTime
          - name: Issued_At
            semantic: "Award notification/issue timestamp"
            data_type: DateTime
        relationships:
          - type: depends_on
            target_entity: RFx_Event
            target_category: schema
            description: "Award finalizes one RFx_Event"
          - type: depends_on
            target_entity: Sourcing_Scenario
            target_category: schema
            description: "Award elects one Sourcing_Scenario"
          - type: syncs_to
            target_entity: Source_List
            target_category: schema
            description: "Approved award updates Source_List entries"
          - type: syncs_to
            target_entity: Purchase_Order
            target_category: schema
            description: "Issued award is converted to Purchase_Orders"
          - type: syncs_to
            target_entity: Contract_Document
            target_category: schema
            description: "Approved award drafts a Contract_Document"
          - type: triggers
            target_entity: Contract Generation
            target_category: workflow
            description: "Award approval triggers contract generation workflow"
          - type: constrained_by
            target_entity: sourcing-award-policy
            target_category: policy
            description: "Approval thresholds, sole-source rules"
          - type: constrained_by
            target_entity: procurement-policy
            target_category: policy
            description: "PO conversion follows procurement policy"

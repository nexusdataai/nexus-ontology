color: "from-purple-500 to-pink-500"
icon: TrendingUp
entities: [Material_Master, Opportunity, Inventory_Position, Market_Signal]
kpis:
  - MAPE < 15%
  - Stockout Rate < 2%
  - Bias < 3%
automations: [refresh_baseline_forecast, incorporate_market_signals]
analytics: [forecast_accuracy_view, stockout_risk_dashboard]
nlq_examples:

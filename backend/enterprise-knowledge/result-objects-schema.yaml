version: "1.0"
name: "AI Automation Result Objects"
description: >
  Semantic schema for computed/derived entities produced by AI automation
  journeys. These result objects are stored in S3 with Glue catalog
  registration and queryable via Athena through the Virtual Data Layer.

domains:
  - name: "Order-to-Cash Results"
    system: "AI_Automation"
    scor_process: "Deliver"
    tables:
      - fdw_table: O2C_Order_Result
        description: >
          Per-order analysis result from the O2C Monitor journey.
          Contains three-way match status, anomaly score, composite risk,
          and risk ranking for each Closed_Won opportunity.
        virtual: true
        source: athena
        glue_table: o2c_orders
        glue_database: call-processing-dev-analytics
        key_fields:
          - name: opportunity_id
            data_type: ID
            semantic: "Salesforce Opportunity ID — links to source order"
          - name: account_id
            data_type: ID
            semantic: "Account that placed the order"
          - name: account_name
            data_type: Text
            semantic: "Customer account name"
          - name: account_tier
            data_type: Picklist
            semantic: "Customer tier: Platinum, Gold, Silver, Bronze"
          - name: order_amount
            data_type: Currency
            semantic: "Total order value from Salesforce Opportunity"
          - name: match_status
            data_type: Picklist
            semantic: "Three-way match result: matched, quantity_mismatch, price_mismatch, missing_delivery, missing_invoice"
          - name: delivered_qty
            data_type: Number
            semantic: "Total quantity delivered from SAP Delivery_Document"
          - name: invoiced_amount
            data_type: Currency
            semantic: "Total invoiced amount from Oracle AR Invoice"
          - name: anomaly_score
            data_type: Number
            semantic: "Anomaly score 0-100, higher means more anomalous"
          - name: composite_risk
            data_type: Number
            semantic: "Composite risk score combining anomaly, value, and tier"
          - name: risk_rank
            data_type: Number
            semantic: "Risk ranking (1 = highest risk)"
          - name: job_id
            data_type: Text
            semantic: "Journey job execution ID"
          - name: processed_at
            data_type: DateTime
            semantic: "Timestamp when this result was computed"

      - fdw_table: O2C_Alert
        description: >
          Alerts generated by the O2C Monitor journey. Includes invoice
          mismatches, overdue accounts, SLA breaches, unusual credit notes,
          and cash flow shortfalls.
        virtual: true
        source: athena
        glue_table: o2c_alerts
        glue_database: call-processing-dev-analytics
        key_fields:
          - name: job_id
            data_type: Text
            semantic: "Journey job execution ID"
          - name: processed_at
            data_type: DateTime
            semantic: "When alerts were generated"
          - name: total_alerts
            data_type: Number
            semantic: "Total number of alerts in this batch"
          - name: alerts
            data_type: Text
            semantic: "JSON array of alert objects with type, severity, entity_id, description, action"

      - fdw_table: O2C_KPI_Snapshot
        description: >
          KPI snapshot from the O2C Monitor journey. Captures DSO,
          match rate, leakage rate, open AR, and cash projection
          at the time of each journey run.
        virtual: true
        source: athena
        glue_table: o2c_kpis
        glue_database: call-processing-dev-analytics
        key_fields:
          - name: job_id
            data_type: Text
            semantic: "Journey job execution ID"
          - name: processed_at
            data_type: DateTime
            semantic: "When KPIs were computed"
          - name: dso
            data_type: Number
            semantic: "Days Sales Outstanding"
          - name: match_rate
            data_type: Percent
            semantic: "Three-way match success rate"
          - name: leakage_rate
            data_type: Percent
            semantic: "Revenue leakage as percentage of total"
          - name: total_open_ar
            data_type: Currency
            semantic: "Total open accounts receivable"
          - name: total_orders_processed
            data_type: Number
            semantic: "Number of orders analyzed in this run"
          - name: total_alerts
            data_type: Number
            semantic: "Number of alerts generated"
          - name: at_risk_amount
            data_type: Currency
            semantic: "Total AR amount at risk (overdue)"

      - fdw_table: O2C_Action_Log
        description: >
          Actions executed by O2C workflow automation — credit holds,
          dispute cases, SLA escalations, dunning notices, expedited
          fulfillment requests, and credit notes.
        virtual: true
        source: athena
        glue_table: o2c_actions
        key_fields:
          - name: action_id
            data_type: ID
            semantic: "Unique action identifier"
          - name: action_type
            data_type: Picklist
            semantic: "Type: credit_hold, dispute_case, escalation, dunning_notice, expedited_fulfillment, credit_note"
          - name: entity_type
            data_type: Text
            semantic: "Target entity type: Account, Invoice, Order, Delivery"
          - name: entity_id
            data_type: ID
            semantic: "Target entity identifier"
          - name: status
            data_type: Picklist
            semantic: "Action status: executed, skipped, pending_approval"
          - name: policy_reference
            data_type: Text
            semantic: "Policy that authorized this action"
          - name: details
            data_type: Text
            semantic: "JSON object with action-specific details"
          - name: job_id
            data_type: Text
            semantic: "Journey job execution ID"
          - name: processed_at
            data_type: DateTime
            semantic: "When the action was executed"

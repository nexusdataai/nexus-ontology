# ============================================================================
# Tool: find_renegotiation_candidates
# Kind: analyze
# ----------------------------------------------------------------------------
# Cursor analog: linter ranking by potential gain / cost.
#
# What it does:
#   Identify contracts that are good renegotiation candidates: large annual
#   spend, short-dated expiry, and an estimated savings opportunity. Used by
#   the contract-renegotiation-trigger playbook.
#
# Inputs:    threshold_usd (minimum annual spend), top_n
# Reads:     Contract, Spend_History
# Writes:    none
# Returns:   {count, results: [{contract_id, vendor_name, annual_spend_usd, expiry_in_days, savings_opportunity_pct}]}
# ============================================================================
tool_id: find_renegotiation_candidates
display_name: Find Renegotiation Candidates
group: procurement
tool_kind: analyze
description: |
  Rank contracts by potential renegotiation upside (spend size + short expiry +
  estimated savings opportunity).
risk_level: read_only
requires_approval: false
cacheable: true
parameters:
  type: object
  properties:
    threshold_usd: { type: number, description: "Minimum annual spend (default 250k)" }
    top_n: { type: integer, description: "Max rows (default 25)" }
  required: []
consumes_entities: [Contract, Spend_History]
produces_entities: []
tags: [procurement, contract, analyze]
example_invocation:
  threshold_usd: 500000

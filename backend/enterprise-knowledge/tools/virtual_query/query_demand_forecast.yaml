# ============================================================================
# Tool: query_demand_forecast
# Kind: read
# ----------------------------------------------------------------------------
# Cursor analog: ripgrep -- pull rows that match a filter.
#
# What it does:
#   Query the latest demand forecast data for a specific SKU, region, or
#   period. Returns forecast overrides and AI-generated predictions.
#
# Inputs:    sku, region, period
# Reads:     DF_Forecast_Result
# Writes:    none
# ============================================================================
tool_id: query_demand_forecast
display_name: Query Demand Forecast
group: virtual_query
description: Query the latest demand forecast data for a specific SKU, region, or
  period. Returns forecast overrides and AI-generated predictions.
risk_level: read_only
requires_approval: false
cacheable: false
parameters:
  type: object
  properties:
    sku:
      type: string
      description: Product/SKU ID (e.g. 'MAT-00042')
    region:
      type: string
      description: Geographic region (North, South, East, West, Central)
    period:
      type: string
      description: Forecast period (e.g. '2026-W18')
  required: []
connector_api: null
consumes_entities:
- DF_Forecast_Result
produces_entities: []
tags:
- forecast
- read
example_invocation: null

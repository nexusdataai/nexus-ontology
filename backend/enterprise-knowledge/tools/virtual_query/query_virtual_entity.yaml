# ============================================================================
# Tool: query_virtual_entity
# Kind: read
# ----------------------------------------------------------------------------
# Cursor analog: ripgrep -- pull rows that match a filter.
#
# What it does:
#   Query a virtual entity by its business name (e.g. Material_Master,
#   AR_Invoice, Account). This is the PRIMARY tool for data queries — it
#   automatically routes to the correct source (FDW, simulator, or mapped
#   table) via mapping rules. Returns rows with virtual field names. Use
#   this INSTEAD of query_table for any entity in the unified schema.
#
# Inputs:    entity_name, fields, limit
# Reads:     *
# Writes:    none
# ============================================================================
tool_id: query_virtual_entity
display_name: Query Virtual Entity
group: virtual_query
description: "Query a virtual entity by its business name (e.g. Material_Master, AR_Invoice,\
  \ Account). This is the PRIMARY tool for data queries \u2014 it automatically routes\
  \ to the correct source (FDW, simulator, or mapped table) via mapping rules. Returns\
  \ rows with virtual field names. Use this INSTEAD of query_table for any entity\
  \ in the unified schema."
risk_level: read_only
requires_approval: false
cacheable: false
parameters:
  type: object
  properties:
    entity_name:
      type: string
      description: Virtual entity name exactly as defined in the schema (e.g. Material_Master,
        AR_Invoice, Inventory_Position)
    fields:
      type: array
      items:
        type: string
      description: Optional list of field names to return. If omitted, returns all
        mapped fields.
    limit:
      type: integer
      description: Max rows to return (default 20, max 50)
      default: 20
  required:
  - entity_name
connector_api: null
consumes_entities:
- '*'
produces_entities: []
tags:
- query
- read
example_invocation: null

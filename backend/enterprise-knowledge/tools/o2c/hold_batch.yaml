#
# What it does:
#   Place a quality hold on a batch, blocking it from shipment or sale.
#   Sets Batch_Master.Status to Blocked in SAP. Triggers
#   quality-deviation-response workflow. HIGH RISK — requires
#   justification.
#
# Inputs:    batch_id, material_id, reason
# Reads:     Batch_Master
# Writes:    Batch_Master, Audit_Event
# ============================================================================
tool_id: hold_batch
display_name: Hold Batch
group: o2c
description: "Place a quality hold on a batch, blocking it from shipment or sale.\
  \ Sets Batch_Master.Status to Blocked in SAP. Triggers quality-deviation-response\
  \ workflow. HIGH RISK \u2014 requires justification."
risk_level: high_risk_write

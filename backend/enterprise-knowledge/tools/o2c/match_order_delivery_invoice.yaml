# ============================================================================
# Tool: match_order_delivery_invoice
# Kind: read
# ----------------------------------------------------------------------------
# Cursor analog: ripgrep -- pull rows that match a filter.
#
# What it does:
#   Perform three-way match for an order: compare Opportunity qty/amount
#   with SAP Delivery qty and Oracle AR Invoice amount. Tolerance: qty
#   +-2%, amount +-5%. Returns match status and any discrepancies.
#
# Inputs:    opportunity_id
# Reads:     Opportunity, Delivery_Document, AR_Invoice
# Writes:    O2C_Order_Result
# ============================================================================
tool_id: match_order_delivery_invoice
display_name: Match Order Delivery Invoice
group: o2c
description: 'Perform three-way match for an order: compare Opportunity qty/amount
  with SAP Delivery qty and Oracle AR Invoice amount. Tolerance: qty +-2%, amount
  +-5%. Returns match status and any discrepancies.'
risk_level: read_only
requires_approval: false
cacheable: false
parameters:
  type: object
  properties:
    opportunity_id:
      type: string
      description: Salesforce Opportunity ID (e.g. OPP-00123)
  required:
  - opportunity_id
connector_api: null
consumes_entities:
- Opportunity
- Delivery_Document
- AR_Invoice
produces_entities:
- O2C_Order_Result
tags:
- o2c
- matching
- read
example_invocation: null

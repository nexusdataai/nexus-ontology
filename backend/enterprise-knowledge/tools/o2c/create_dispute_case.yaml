cacheable: false
parameters:
  type: object
  properties:
    opportunity_id:
      type: string
      description: Opportunity ID
    invoice_id:
      type: string
      description: Invoice ID with mismatch
    dispute_reason:
      type: string
      description: Reason for dispute

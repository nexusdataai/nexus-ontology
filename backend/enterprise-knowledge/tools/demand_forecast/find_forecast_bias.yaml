# ============================================================================
# Tool: find_forecast_bias
# Kind: analyze
# ----------------------------------------------------------------------------
# Cursor analog: a regression test that checks for systematic drift.
#
# What it does:
#   Surface SKU x region pairs with persistent forecast bias (over- or under-
#   forecast across the recent windows). Drives the bias-investigation and
#   forecast-override-validation playbooks.
#
# Inputs:    top_n, region (optional)
# Reads:     Forecast, Actual_Sales
# Writes:    none
# Returns:   {count, results: [{product_id, region, bias_pct, direction, periods}]}
# ============================================================================
tool_id: find_forecast_bias
display_name: Find Forecast Bias
group: demand_forecast
tool_kind: analyze
description: |
  Identify SKU x region pairs with persistent forecast bias (over / under) and
  drive correction via override validation.
risk_level: read_only
requires_approval: false
cacheable: true
parameters:
  type: object
  properties:
    top_n: { type: integer, description: "Max rows (default 25)" }
    region: { type: string, description: "Optional region filter" }
  required: []
consumes_entities: [Forecast, Actual_Sales]
produces_entities: []
tags: [forecast, bias, analyze]
example_invocation:
  top_n: 25

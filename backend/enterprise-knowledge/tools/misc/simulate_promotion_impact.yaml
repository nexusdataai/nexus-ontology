# ============================================================================
# Tool: simulate_promotion_impact
# Kind: read
# ----------------------------------------------------------------------------
# Cursor analog: ripgrep -- pull rows that match a filter.
#
# What it does:
#   Simulate the demand impact of a promotion on a given SKU in a region.
#   Returns expected volume lift, cannibalization estimate, and policy
#   constraints. Promotion types: Discount, BOGO, Bundle, Display,
#   Sampling.
#
# Inputs:    sku, region, promotion_type, discount_pct
# Reads:     Opportunity, Campaign
# Writes:    none
# ============================================================================
tool_id: simulate_promotion_impact

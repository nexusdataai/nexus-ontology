# ============================================================================
# Tool: score_supplier_risk
# Kind: read
# ----------------------------------------------------------------------------
# Cursor analog: ripgrep -- pull rows that match a filter.
#
# What it does:
#   Retrieve the supplier risk scoring framework and related policies for
#   a vendor. Shows the weighted risk model (delivery 30%, financial 20%,
#   geographic 15%, quality 15%, contract 10%, external 10%) and risk tier
#   thresholds.
#
# Inputs:    vendor_id, vendor_name
# Reads:     Vendor_Master, Goods_Receipt, Quality_Inspection_Lot
# Writes:    SCR_Vendor_Result
# ============================================================================
tool_id: score_supplier_risk
display_name: Score Supplier Risk
group: misc
description: Retrieve the supplier risk scoring framework and related policies for
  a vendor. Shows the weighted risk model (delivery 30%, financial 20%, geographic
  15%, quality 15%, contract 10%, external 10%) and risk tier thresholds.
risk_level: read_only
requires_approval: false
cacheable: false
parameters:
  type: object
  properties:
    vendor_id:
      type: string
      description: SAP Vendor ID
    vendor_name:
      type: string
      description: Vendor name to search by
  required: []
connector_api: null
consumes_entities:
- Vendor_Master
- Goods_Receipt
- Quality_Inspection_Lot
produces_entities:
- SCR_Vendor_Result
tags:
- supply-chain
- risk
- read
example_invocation: null

# ============================================================================
# Tool: search_schema_knowledge
# Kind: read
# ----------------------------------------------------------------------------
# Cursor analog: ripgrep -- pull rows that match a filter.
#
# What it does:
#   Semantic search over indexed FDW schema metadata, TMF specs, and
#   policies. Use this to find which tables/columns relate to a concept
#   (e.g. 'billing', 'customer address', 'product pricing') without
#   knowing exact table names.
#
# Inputs:    query, content_type, limit
# Reads:     none
# Writes:    none
# ============================================================================
tool_id: search_schema_knowledge
display_name: Search Schema Knowledge
group: misc
description: Semantic search over indexed FDW schema metadata, TMF specs, and policies.
  Use this to find which tables/columns relate to a concept (e.g. 'billing', 'customer
  address', 'product pricing') without knowing exact table names.
risk_level: read_only
requires_approval: false
cacheable: false
parameters:
  type: object
  properties:
    query:
      type: string
      description: Natural language description of what you're looking for
    content_type:
      type: string
      enum:
      - fdw_table
      - fdw_server
      - tmf_spec
      description: Optional filter by content type
    limit:
      type: integer
      description: Max results (default 10)
      default: 10
  required:
  - query
connector_api: null
consumes_entities: []
produces_entities: []
tags:
- rag
- schema
- read
example_invocation: null

# ============================================================================
# Tool: generate_o2c_alerts
# Kind: read
# ----------------------------------------------------------------------------
# Cursor analog: ripgrep -- pull rows that match a filter.
#
# What it does:
#   Evaluate O2C alert rules: invoice mismatch >5%, 3+ overdue >$100K, SLA
#   breach imminent, unusual credit notes, cash shortfall. Returns
#   triggered alerts and KPIs.
#
# Inputs:    match_results, anomaly_scores, cash_projection
# Reads:     AR_Invoice, Opportunity, Account
# Writes:    O2C_Alert
# ============================================================================
tool_id: generate_o2c_alerts
display_name: Generate O2C Alerts
group: misc

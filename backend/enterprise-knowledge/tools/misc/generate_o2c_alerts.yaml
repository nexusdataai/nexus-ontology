cacheable: false
parameters:
  type: object
  properties:
    match_results:
      type: array
      items:
        type: object
      description: Array of match results from three-way match
    anomaly_scores:
      type: array
      items:
        type: object
      description: Array of anomaly scores
    cash_projection:
      type: object
      properties: {}
      description: Cash flow projection result
  required: []
connector_api: null
consumes_entities:
- AR_Invoice
- Opportunity
- Account
produces_entities:
- O2C_Alert
tags:
- o2c
- alerts
- read
example_invocation: null

parameters:
  type: object
  properties:
    opportunity_id:
      type: string
      description: Opportunity ID
    match_result:
      type: object
      properties: {}
      description: Result from match_order_delivery_invoice
  required:
  - opportunity_id
connector_api: null
consumes_entities:
- Opportunity
- AR_Invoice
- Account
produces_entities:
- O2C_Order_Result
tags:
- o2c
- scoring
- read
example_invocation: null

# ============================================================================
# Tool: score_order_anomaly
# Kind: read
# ----------------------------------------------------------------------------
# Cursor analog: ripgrep -- pull rows that match a filter.
#
# What it does:
#   Score anomalies for an order: cycle time deviations, missing
#   deliveries/invoices, unpaid invoices, large credit notes. Returns
#   anomaly score 0-100 and list of anomalies.
#
# Inputs:    opportunity_id, match_result
# Reads:     Opportunity, AR_Invoice, Account
# Writes:    O2C_Order_Result
# ============================================================================
tool_id: score_order_anomaly

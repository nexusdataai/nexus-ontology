# ============================================================================
# Tool: discover_columns
# Kind: read
# ----------------------------------------------------------------------------
# Cursor analog: ripgrep -- pull rows that match a filter.
#
# What it does:
#   Get column metadata (name, data type, nullable) for a specific foreign
#   table. Use this to understand a table's schema before querying it.
#
# Inputs:    table_name, schema_name
# Reads:     none
# Writes:    none
# ============================================================================
tool_id: discover_columns
display_name: Discover Columns
group: misc
description: Get column metadata (name, data type, nullable) for a specific foreign
  table. Use this to understand a table's schema before querying it.
risk_level: read_only
requires_approval: false
cacheable: false
parameters:
  type: object
  properties:
    table_name:
      type: string
      description: The table name (e.g. 'Account', 'Opportunity', 'Lead')
    schema_name:
      type: string
      description: 'Schema name (default: sfdc_itxp2dev)'
      default: sfdc_itxp2dev
  required:
  - table_name
connector_api: null
consumes_entities: []
produces_entities: []
tags:
- fdw
- read
example_invocation: null

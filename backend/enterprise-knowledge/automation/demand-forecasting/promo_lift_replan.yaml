use_case_id: df.promo_lift_replan
title: Promo Lift Re-Plan
solution_id: demand-forecasting
bucket: supply-chain
description: 'Re-plan demand after a promo lift event. Simulate the impact of an upcoming
  promotion on the forecast and create override rows so downstream planning reflects
  the lift.

  '
status: active
tags:
- forecast
- promo
- replan
kpi_impact:
- forecast_accuracy_pct
- promo_uplift_pct
consumes_entities:
- Forecast
produces_entities:
- Forecast_Override
- Audit_Event
stages:
- stage_id: resolve
  name: Resolve
  order: 1
  description: Identify the entities in scope.
  steps:
  - step_id: list
    name: List Candidates
    order: 1
    tool: simulate_promotion_impact
    params:
      sku: ${context.sku}
      region: ${context.region}
      promotion_type: Discount
      discount_pct: 15
- stage_id: decide
  name: Decide
  order: 2
  description: 'Approve override magnitudes per SKU x region pair. LLM-only step;
    no

    tool binding because the reasoning is the action.

    '
  steps:
  - step_id: choose_action
    name: Choose Action Per Candidate
    order: 1
- stage_id: act
  name: Act
  order: 3
  steps:
  - step_id: act_1
    name: Create Forecast Override
    order: 1
    tool: create_forecast_override
    params:
      product_id: ${context.sku}
      region: ${context.region}
      period: ${context.period}
      override_qty: ${stage.resolve.list.expected_volume_lift}
      justification: promo-lift
- stage_id: verify
  name: Verify
  order: 4
  description: Re-query and write Outcome_Tracker row.
  steps:
  - step_id: requery
    name: Re-Run Analyzer
    order: 1
    tool: simulate_promotion_impact
    params:
      sku: ${context.sku}
      region: ${context.region}
      promotion_type: Discount
      discount_pct: 15
  - step_id: write_outcome
    name: Append Outcome Tracker
    order: 2
    tool: record_outcome
    params:
      action_id: ${context.run_id}
      kpi_name: forecast_accuracy_pct
      kpi_before: 0
      kpi_after: 0

use_case_id: df.stockout_prevention
title: Stockout Prevention Trigger
solution_id: demand-forecasting
bucket: supply-chain
description: 'Pre-empt stockouts on volatile SKUs. Find high-CoV SKUs, project shortfall,
  and trigger transfer orders + slack alert to ops.

  '
status: active
tags:
- forecast
- stockout
- trigger
kpi_impact:
- stockout_rate
- fill_rate
consumes_entities:
- Forecast
- Sales_Order
produces_entities:
- Warehouse_Transfer
- Slack_Message
- Audit_Event
stages:
- stage_id: resolve
  name: Resolve
  order: 1
  description: Identify the entities in scope.
  steps:
  - step_id: list
    name: List Candidates
    order: 1
    tool: find_volatile_skus
    params:
      top_n: 25
- stage_id: decide
  name: Decide
  order: 2
  description: 'Decide expedite-from / expedite-to plant per volatile SKU. LLM-only

    step; no tool binding because the reasoning is the action.

    '
  steps:
  - step_id: choose_action
    name: Choose Action Per Candidate
    order: 1
- stage_id: act
  name: Act
  order: 3
  steps:
  - step_id: act_1
    name: Create Transfer Order
    order: 1
    tool: create_transfer_order
    params:
      from_plant: PLT-N1
      to_plant: PLT-N3
      material_id: ${item.product_id}
      quantity: 100
- stage_id: notify
  name: Notify
  order: 4
  steps:
  - step_id: notify_1
    name: Send Slack Alert
    order: 1
    tool: send_slack_alert
    params:
      channel: '#df-ops'
      message: Stockout prevention triggered
      severity: warning
- stage_id: verify
  name: Verify
  order: 5
  description: Re-query and write Outcome_Tracker row.
  steps:
  - step_id: requery
    name: Re-Run Analyzer
    order: 1
    tool: find_volatile_skus
    params:
      top_n: 25
  - step_id: write_outcome
    name: Append Outcome Tracker
    order: 2
    tool: record_outcome
    params:
      action_id: ${context.run_id}
      kpi_name: stockout_rate
      kpi_before: 0
      kpi_after: 0

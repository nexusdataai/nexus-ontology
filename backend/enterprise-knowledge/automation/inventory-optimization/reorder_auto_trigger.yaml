use_case_id: io.reorder_auto_trigger
title: Reorder Auto-Trigger
solution_id: inventory-optimization
bucket: supply-chain
description: 'Auto-trigger reorders when stock drops below safety. Compare current
  inventory positions against safety stock. Where shortfalls exist, create a transfer
  order or escalate to PO approval.

  '
status: active
tags:
- inventory
- reorder
- safety-stock
kpi_impact:
- stockout_rate
- fill_rate
consumes_entities:
- Material
- Inventory_Position
produces_entities:
- Warehouse_Transfer
- Audit_Event
stages:
- stage_id: resolve
  name: Resolve
  order: 1
  description: Identify the entities in scope.
  steps:
  - step_id: list
    name: List Candidates
    order: 1
    tool: get_inventory_position
    params:
      material_id: ${item.material_id}
- stage_id: decide
  name: Decide
  order: 2
  description: 'Decide transfer vs new PO based on lead-time vs urgency. LLM-only

    step; no tool binding because the reasoning is the action.

    '
  steps:
  - step_id: choose_action
    name: Choose Action Per Candidate
    order: 1
- stage_id: act
  name: Act
  order: 3
  steps:
  - step_id: act_1
    name: Create Transfer Order
    order: 1
    tool: create_transfer_order
    params:
      from_plant: PLT-N1
      to_plant: ${item.plant_id}
      material_id: ${item.material_id}
      quantity: ${item.shortfall_qty}
- stage_id: verify
  name: Verify
  order: 4
  description: Re-query and write Outcome_Tracker row.
  steps:
  - step_id: requery
    name: Re-Run Analyzer
    order: 1
    tool: get_inventory_position
    params:
      material_id: ${item.material_id}
  - step_id: write_outcome
    name: Append Outcome Tracker
    order: 2
    tool: record_outcome
    params:
      action_id: ${context.run_id}
      kpi_name: stockout_rate
      kpi_before: 0
      kpi_after: 0

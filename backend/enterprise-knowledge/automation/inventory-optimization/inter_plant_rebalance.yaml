use_case_id: io.inter_plant_rebalance
title: Inter-Plant Rebalance
solution_id: inventory-optimization
bucket: supply-chain
description: 'Rebalance excess stock across plants. Identify plants with excess near-expiry
  stock and move to plants with deficits via warehouse transfer orders.

  '
status: active
tags:
- inventory
- rebalance
kpi_impact:
- fill_rate
- expiry_writeoff_usd
consumes_entities:
- Material
- Inventory_Position
produces_entities:
- Warehouse_Transfer
- Audit_Event
stages:
- stage_id: resolve
  name: Resolve
  order: 1
  description: Identify the entities in scope.
  steps:
  - step_id: list
    name: List Candidates
    order: 1
    tool: find_excess_inventory_near_expiry
    params:
      horizon_days: 60
- stage_id: decide
  name: Decide
  order: 2
  description: 'Pair surplus plant -> deficit plant per material. LLM-only step; no

    tool binding because the reasoning is the action.

    '
  steps:
  - step_id: choose_action
    name: Choose Action Per Candidate
    order: 1
- stage_id: act
  name: Act
  order: 3
  steps:
  - step_id: act_1
    name: Create Transfer Order
    order: 1
    tool: create_transfer_order
    params:
      from_plant: ${item.plant}
      to_plant: ${item.target_plant}
      material_id: ${item.material_id}
      quantity: ${item.qty}
- stage_id: verify
  name: Verify
  order: 4
  description: Re-query and write Outcome_Tracker row.
  steps:
  - step_id: requery
    name: Re-Run Analyzer
    order: 1
    tool: find_excess_inventory_near_expiry
    params:
      horizon_days: 60
  - step_id: write_outcome
    name: Append Outcome Tracker
    order: 2
    tool: record_outcome
    params:
      action_id: ${context.run_id}
      kpi_name: fill_rate
      kpi_before: 0
      kpi_after: 0

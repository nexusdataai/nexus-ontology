use_case_id: scr.single_source_derisk
title: Single-Source De-Risking
solution_id: supply-chain-risk
bucket: supply-chain
description: 'De-risk single-sourced items by approving alternatives. Identify items
  with sole-supplier exposure and approve alternative vendor POs to diversify supply.

  '
status: active
tags:
- scr
- single-source
- derisk
kpi_impact:
- supplier_diversification_pct
consumes_entities:
- Supplier
- Material
produces_entities:
- Oracle_Purchase_Order
- Audit_Event
stages:
- stage_id: resolve
  name: Resolve
  order: 1
  description: Identify the entities in scope.
  steps:
  - step_id: list
    name: List Candidates
    order: 1
    tool: score_supplier_disruption_risk
    params:
      top_n: 20
- stage_id: decide
  name: Decide
  order: 2
  description: 'Pick best alternative vendor per single-sourced material. LLM-only

    step; no tool binding because the reasoning is the action.

    '
  steps:
  - step_id: choose_action
    name: Choose Action Per Candidate
    order: 1
- stage_id: act
  name: Act
  order: 3
  steps:
  - step_id: act_1
    name: Approve Purchase Order
    order: 1
    requires_approval: true
    tool: approve_purchase_order
    params:
      po_id: PO-NEW-${item.vendor_id}
      status: Approved
- stage_id: verify
  name: Verify
  order: 4
  description: Re-query and write Outcome_Tracker row.
  steps:
  - step_id: requery
    name: Re-Run Analyzer
    order: 1
    tool: score_supplier_disruption_risk
    params:
      top_n: 20
  - step_id: write_outcome
    name: Append Outcome Tracker
    order: 2
    tool: record_outcome
    params:
      action_id: ${context.run_id}
      kpi_name: supplier_diversification_pct
      kpi_before: 0
      kpi_after: 0

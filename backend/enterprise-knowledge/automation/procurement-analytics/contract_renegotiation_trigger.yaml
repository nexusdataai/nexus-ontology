use_case_id: pa.contract_renegotiation_trigger
title: Contract Re-negotiation Trigger
solution_id: procurement-analytics
bucket: supply-chain
description: 'Trigger renegotiation on under-performing contracts. Identify renegotiation
  candidates and update vendor terms in line with the negotiation outcome.

  '
status: active
tags:
- procurement
- contract
- renegotiation
kpi_impact:
- contract_savings_usd
consumes_entities:
- Contract
- Spend_History
produces_entities:
- Oracle_AR_Customer
- Audit_Event
stages:
- stage_id: resolve
  name: Resolve
  order: 1
  description: Identify the entities in scope.
  steps:
  - step_id: list
    name: List Candidates
    order: 1
    tool: find_renegotiation_candidates
    params:
      top_n: 25
- stage_id: decide
  name: Decide
  order: 2
  description: 'Decide updated terms per contract. LLM-only step; no tool binding

    because the reasoning is the action.

    '
  steps:
  - step_id: choose_action
    name: Choose Action Per Candidate
    order: 1
- stage_id: act
  name: Act
  order: 3
  steps:
  - step_id: act_1
    name: Update Account Terms
    order: 1
    requires_approval: true
    tool: update_account_terms
    params:
      customer_id: ${item.contract_id}
      payment_terms: Net_45
- stage_id: verify
  name: Verify
  order: 4
  description: Re-query and write Outcome_Tracker row.
  steps:
  - step_id: requery
    name: Re-Run Analyzer
    order: 1
    tool: find_renegotiation_candidates
    params:
      top_n: 25
  - step_id: write_outcome
    name: Append Outcome Tracker
    order: 2
    tool: record_outcome
    params:
      action_id: ${context.run_id}
      kpi_name: contract_savings_usd
      kpi_before: 0
      kpi_after: 0

use_case_id: esg.initiative_roi_review
title: Initiative ROI Review
solution_id: esg-sustainability
bucket: esg
description: 'Review ROI of running ESG initiatives and record outcomes. Score initiative
  impact via CLV adapter; record outcomes so the next planning cycle prioritises high-ROI
  initiatives.

  '
status: active
tags:
- esg
- roi
- review
kpi_impact:
- esg_initiative_roi_pct
consumes_entities:
- AR_Invoice
- Customer
produces_entities:
- O2C_Outcome_Tracker
- Audit_Event
stages:
- stage_id: resolve
  name: Resolve
  order: 1
  description: Identify the entities in scope.
  steps:
  - step_id: list
    name: List Candidates
    order: 1
    tool: score_customer_lifetime_value
    params:
      top_n: 25
- stage_id: decide
  name: Decide
  order: 2
  description: 'Decide which initiatives to scale, sustain, or sunset. LLM-only step;

    no tool binding because the reasoning is the action.

    '
  steps:
  - step_id: choose_action
    name: Choose Action Per Candidate
    order: 1
- stage_id: verify
  name: Verify
  order: 3
  description: Re-query and write Outcome_Tracker row.
  steps:
  - step_id: requery
    name: Re-Run Analyzer
    order: 1
    tool: score_customer_lifetime_value
    params:
      top_n: 25
  - step_id: write_outcome
    name: Append Outcome Tracker
    order: 2
    tool: record_outcome
    params:
      action_id: ${context.run_id}
      kpi_name: esg_initiative_roi_pct
      kpi_before: 0
      kpi_after: 0

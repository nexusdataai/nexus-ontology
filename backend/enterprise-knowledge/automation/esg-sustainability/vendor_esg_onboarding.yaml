use_case_id: esg.vendor_esg_onboarding
title: Vendor ESG Onboarding
solution_id: esg-sustainability
bucket: esg
description: 'Onboard vendors with ESG compliance gating. Run compliance check on
  the prospective vendor. On fail, block the vendor; on pass, update terms to reflect
  onboarding.

  '
status: active
tags:
- esg
- vendor
- onboarding
kpi_impact:
- vendor_esg_compliant_pct
consumes_entities:
- Compliance_Check
produces_entities:
- Oracle_Supplier
- Oracle_AR_Customer
- Audit_Event
stages:
- stage_id: resolve
  name: Resolve
  order: 1
  description: Identify the entities in scope.
  steps:
  - step_id: list
    name: List Candidates
    order: 1
    tool: find_compliance_breaches
    params:
      top_n: 25
- stage_id: decide
  name: Decide
  order: 2
  description: 'Decide block vs onboard based on breach severity. LLM-only step; no

    tool binding because the reasoning is the action.

    '
  steps:
  - step_id: choose_action
    name: Choose Action Per Candidate
    order: 1
- stage_id: act
  name: Act
  order: 3
  steps:
  - step_id: act_1
    name: Block Supplier Orders
    order: 1
    requires_approval: true
    tool: block_supplier_orders
    params:
      supplier_id: ${item.vendor_id}
      block: true
      reason: ESG onboarding fail
  - step_id: act_2
    name: Update Account Terms
    order: 2
    requires_approval: true
    tool: update_account_terms
    params:
      customer_id: ${item.vendor_id}
      payment_terms: Net_60
- stage_id: verify
  name: Verify
  order: 4
  description: Re-query and write Outcome_Tracker row.
  steps:
  - step_id: requery
    name: Re-Run Analyzer
    order: 1
    tool: find_compliance_breaches
    params:
      top_n: 25
  - step_id: write_outcome
    name: Append Outcome Tracker
    order: 2
    tool: record_outcome
    params:
      action_id: ${context.run_id}
      kpi_name: vendor_esg_compliant_pct
      kpi_before: 0
      kpi_after: 0

use_case_id: c360.at_risk_save
title: At-Risk Account Save Play
solution_id: customer-360
bucket: customer-360
description: 'Save plays for low-health accounts. When health-score drops below the
  threshold, run a coordinated save play: open a CSM outreach task, attach a tailored
  discount, and follow up via email.

  '
status: active
tags:
- c360
- save-play
- health
kpi_impact:
- churn_rate
- save_rate
- expansion_arr
consumes_entities:
- Customer
- Activity_Log
- Support_Case
produces_entities:
- Task
- Oracle_AR_Promotion
- Email_Campaign_Send
- O2C_Outcome_Tracker
- Audit_Event
stages:
- stage_id: resolve
  name: Resolve
  order: 1
  description: Identify the entities in scope.
  steps:
  - step_id: list
    name: List Candidates
    order: 1
    tool: find_churning_customers
    params:
      horizon_days: 60
      top_n: 25
- stage_id: diagnose
  name: Diagnose
  order: 2
  description: Score / decompose the candidates.
  steps:
  - step_id: diag
    name: Score / Project
    order: 1
    tool: score_customer_lifetime_value
    params: {}
- stage_id: decide
  name: Decide
  order: 3
  description: 'Pick the right save play (CSM call vs discount vs both) per CLV tier.

    LLM-only step; no tool binding because the reasoning is the action.

    '
  steps:
  - step_id: choose_action
    name: Choose Action Per Candidate
    order: 1
- stage_id: act
  name: Act
  order: 4
  steps:
  - step_id: act_1
    name: Assign Csm Outreach
    order: 1
    tool: assign_csm_outreach
    params:
      account_id: ${item.customer_id}
      subject: Save play -- low health-score outreach
      outreach_type: csm_outreach
  - step_id: act_2
    name: Apply Promo Discount
    order: 2
    requires_approval: true
    tool: apply_promo_discount
    params:
      name: Save Play Discount
      discount_pct: 10.0
      applies_to:
        segment: at_risk
- stage_id: notify
  name: Notify
  order: 5
  steps:
  - step_id: notify_1
    name: Send Email Campaign
    order: 1
    tool: send_email_campaign
    params:
      subject: We value your partnership -- exclusive offer
      recipients: ${stage.resolve.list.results}
- stage_id: verify
  name: Verify
  order: 6
  description: Re-query and write Outcome_Tracker row.
  steps:
  - step_id: requery
    name: Re-Run Analyzer
    order: 1
    tool: find_churning_customers
    params:
      horizon_days: 60
      top_n: 25
  - step_id: write_outcome
    name: Append Outcome Tracker
    order: 2
    tool: record_outcome
    params:
      action_id: ${context.run_id}
      kpi_name: churn_rate
      kpi_before: ${stage.resolve.list.count}
      kpi_after: ${stage.verify.requery.count}

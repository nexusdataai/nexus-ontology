use_case_id: cpq_buy.sourcing_cpq_e2e_demo
title: Sourcing CPQ End-to-End Demo
solution_id: sourcing-cpq
bucket: cpq-buy
description: 'Full Sourcing CPQ happy-path: launch RFx, build should-cost,
  recommend and solicit vendor panel, score bids, run all three award
  scenarios, recommend Pareto-optimal split, draft contract, and issue PO.

  '
status: active
tags:
- cpq
- e2e
- demo
- regression
kpi_impact:
- rfx_cycle_time
- savings_vs_should_cost
- vendor_concentration
- time_to_contract
consumes_entities:
- Material_Master
- Plant_Master
- Source_List
- Vendor_Master
- Commodity_Price
- Purchase_Requisition
produces_entities:
- RFx_Event
- RFx_Line
- RFx_Invitation
- Should_Cost_Model
- Sourcing_Scenario
- Sourcing_Award
- Contract_Document
- Audit_Event
stages:
- stage_id: launch
  name: Launch RFx
  order: 1
  steps:
  - step_id: should_cost
    name: Build Should-Cost Model
    order: 1
    tool: should_cost_model
    params:
      material_id: ${context.material_id}
      qty: ${context.target_qty}
  - step_id: launch
    name: Create RFx_Event
    order: 2
    requires_approval: true
    tool: launch_rfx
    params:
      category: ${context.category}
      plants: ${context.plants}
      target_qty: ${context.target_qty}
      due_date: ${context.due_date}
- stage_id: invite
  name: Invite Vendors
  order: 2
  steps:
  - step_id: panel
    name: Recommend Panel
    order: 1
    tool: recommend_vendor_panel
    params:
      event_id: ${stage.launch.launch.event_id}
      top_n: 5
  - step_id: solicit
    name: Solicit Bids
    order: 2
    tool: solicit_vendors
    params:
      event_id: ${stage.launch.launch.event_id}
      vendor_ids: ${stage.invite.panel.panel}
- stage_id: evaluate
  name: Score & Scenario
  order: 3
  steps:
  - step_id: score_each
    name: Score Each Bid
    order: 1
    tool: score_vendor_response
    params:
      vendor_quote_id: ${item.Vendor_Quote_ID}
  - step_id: pareto
    name: Recommend Pareto-Optimal Split
    order: 2
    tool: recommend_award_split
    params:
      event_id: ${stage.launch.launch.event_id}
- stage_id: award
  name: Award & Contract
  order: 4
  steps:
  - step_id: draft
    name: Draft Contract
    order: 1
    tool: draft_contract
    params:
      award_id: ${context.award_id}
      template: standard
  - step_id: convert
    name: Issue Award & Create PO
    order: 2
    requires_approval: true
    tool: convert_award_to_po
    params:
      award_id: ${context.award_id}

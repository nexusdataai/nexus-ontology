[behave]
paths = tests/bdd/features
format = pretty
show_skipped = false
show_timings = true
stdout_capture = no
stderr_capture = no
log_capture = no
color = true
summary = true

[behave.formatters]
html = behave_html_formatter:HTMLFormatter
json = behave.formatters.json:JSONFormatter

[behave.userdata]
aws_region = us-east-1
environment = test

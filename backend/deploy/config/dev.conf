# Alert Engine MCP Server - Development Environment Configuration

# Environment Details
ENVIRONMENT="dev"
PROJECT_NAME="ai-engine"

# Domain Configuration
BASE_DOMAIN="totogicore.com"
SUBDOMAIN="dev-ai-engine"  # Resolves to: api.dev-alert-engine.totogicore.com
HOSTED_ZONE_ID="Z084501638STQ2EKKSIA"  # Update with actual totogicore.com hosted zone ID

# AWS Configuration
AWS_REGION="us-east-1"
DEPLOYMENT_REGION="us-east-1"

# Stack Names (will be auto-generated if not specified)
MAIN_STACK_NAME="ai-engine-main-dev"
NETWORK_STACK_NAME="ai-engine-network-dev"
STORAGE_STACK_NAME="ai-engine-storage-dev"
BACKEND_STACK_NAME="ai-engine-backend-dev"
DOMAIN_STACK_NAME="ai-engine-domain-dev"

# S3 Configuration
S3_BUCKET_NAME="ai-engine-data-dev"

# ECS Configuration (Matching CDK dev config)
ECS_TASK_CPU=2048       # 2 vCPU (matching current CDK config)
ECS_TASK_MEMORY=16384   # 16 GB RAM (matching current CDK config)
ECS_DESIRED_COUNT=1
ECS_MIN_CAPACITY=1
ECS_MAX_CAPACITY=2
ENABLE_AUTO_SCALING="false"

# Network Configuration
VPC_MAX_AZS=2
VPC_NAT_GATEWAYS=0  # Maximum cost savings - no NAT gateways for dev
LOG_RETENTION_DAYS=7

# Existing VPC Configuration (leave empty to create new VPC)
EXISTING_VPC_ID="vpc-027288988b1ac3149"                    # CN-Production VPC in account 764119721991
EXISTING_PUBLIC_SUBNET_1="subnet-040bc0c4662df205e"        # CNA-Production-Public (us-east-1c)
EXISTING_PUBLIC_SUBNET_2="subnet-099e05053bb5b6615"        # CNB-Production-Public (us-east-1d)
EXISTING_PRIVATE_SUBNET_1="subnet-0b77e635f649dd520"       # CNA-Production-Private (us-east-1c)
EXISTING_PRIVATE_SUBNET_2="subnet-0de6bd1172236b522"       # CNB-Production-Private (us-east-1d)

# Docker Configuration
DOCKER_IMAGE_URI="764119721991.dkr.ecr.us-east-1.amazonaws.com/alert-engine-mcp-server-dev:latest"

# Application Configuration
APP_LOG_LEVEL="DEBUG"
SECRETS_ARN="arn:aws:secretsmanager:us-east-2:764119721991:secret:dsql/tmf-6vgxCr"

# Domain Configuration
CREATE_SSL_CERTIFICATE="false"  # Use manually created certificate
SSL_CERTIFICATE_ARN="arn:aws:acm:us-east-1:764119721991:certificate/c2df3507-6013-4207-9575-21cc50ffc769"  # Update with actual ACM certificate ARN for api.dev-alert-engine.totogicore.com

# IAM Roles Configuration
CREATE_IAM_ROLES="true"  # Keep as true - CloudFormation won't recreate if unchanged

# External AWS Role Configuration (for cross-account S3 access to econet-alerts)
ROLE_ARN="arn:aws:iam::764119721991:role/AssumableExternalAccessRole"
EXTERNAL_PROFILE="external-access"

# Feature Flags
ENABLE_MONITORING="true"
ENABLE_DOMAIN_SETUP="true"         # Enable domain setup for HTTPS
CREATE_HEALTH_CHECK="false"        # Disable Route53 health check for dev (requires additional permissions)

# CloudFormation Template Configuration
CLOUDFORMATION_TEMPLATES_DIR="."
MAIN_TEMPLATE="cloudformation-main-template.yaml"
IAM_ROLES_TEMPLATE="cloudformation-iam-roles-template.yaml"
GLOBAL_TEMPLATE="cloudformation-global-template.yaml"
NETWORK_TEMPLATE="cloudformation-network-template.yaml"
STORAGE_TEMPLATE="cloudformation-storage-template.yaml"
BACKEND_TEMPLATE="cloudformation-backend-template.yaml"
DOMAIN_TEMPLATE="cloudformation-domain-template.yaml"

# Build Configuration
BUILD_ENVIRONMENT="development"
NODE_ENV="development"


# Alert Engine MCP Server - Staging Environment Configuration

# Environment Details
ENVIRONMENT="stage"
PROJECT_NAME="ai-engine"

# Domain Configuration
BASE_DOMAIN="totogicore.com"
SUBDOMAIN="stage-ai-engine"  # Resolves to: api.stage-alert-engine.totogicore.com
HOSTED_ZONE_ID="Z084501638STQ2EKKSIA"  # Update with actual totogicore.com hosted zone ID

# AWS Configuration
AWS_REGION="us-east-1"
DEPLOYMENT_REGION="us-east-1"

# Stack Names (will be auto-generated if not specified)
MAIN_STACK_NAME="ai-engine-main-stage"
NETWORK_STACK_NAME="ai-engine-network-stage"
STORAGE_STACK_NAME="ai-engine-storage-stage"
BACKEND_STACK_NAME="ai-engine-backend-stage"
DOMAIN_STACK_NAME="ai-engine-domain-stage"

# S3 Configuration
S3_BUCKET_NAME="alert-engine-data-stage"
ENABLE_S3_VERSIONING="true"
ENABLE_S3_LIFECYCLE_RULES="true"

# ECS Configuration (Matching CDK stage config)
ECS_TASK_CPU=2048       # 2 vCPU (matching current CDK config)
ECS_TASK_MEMORY=16384   # 16 GB RAM (matching current CDK config)
ECS_DESIRED_COUNT=1
ECS_MIN_CAPACITY=1
ECS_MAX_CAPACITY=3
ENABLE_AUTO_SCALING="true"

# Network Configuration
VPC_MAX_AZS=2
VPC_NAT_GATEWAYS=0  # Cost optimization for staging
LOG_RETENTION_DAYS=14

# Existing VPC Configuration (leave empty to create new VPC)
EXISTING_VPC_ID=""                    # Optional: Use existing VPC ID (e.g., vpc-0123456789abcdef)
EXISTING_PUBLIC_SUBNET_1=""           # Optional: Public subnet in AZ1 (e.g., subnet-0123456789abcdef)
EXISTING_PUBLIC_SUBNET_2=""           # Optional: Public subnet in AZ2
EXISTING_PRIVATE_SUBNET_1=""          # Optional: Private subnet in AZ1 (leave empty if no NAT gateways)
EXISTING_PRIVATE_SUBNET_2=""          # Optional: Private subnet in AZ2 (leave empty if no NAT gateways)
EXISTING_INTERNET_GATEWAY_ID=""       # Optional: Internet Gateway ID (e.g., igw-0123456789abcdef)

# Docker Configuration
DOCKER_IMAGE_URI="764119721991.dkr.ecr.us-east-1.amazonaws.com/alert-engine-mcp-server-stage:latest"

# Application Configuration
APP_LOG_LEVEL="INFO"
SECRETS_ARN="arn:aws:secretsmanager:us-east-2:764119721991:secret:dsql/tmf-6vgxCr"

# Domain Configuration
CREATE_SSL_CERTIFICATE="false"  # Use manually created certificate
SSL_CERTIFICATE_ARN=""  # Update with actual ACM certificate ARN for api.stage-alert-engine.totogicore.com

# IAM Roles Configuration
CREATE_IAM_ROLES="true"  # Keep as true - CloudFormation won't recreate if unchanged

# External AWS Role Configuration (for cross-account S3 access to econet-alerts)
ROLE_ARN="arn:aws:iam::764119721991:role/AssumableExternalAccessRole"
EXTERNAL_PROFILE="external-access-stage"

# Feature Flags
ENABLE_MONITORING="true"
ENABLE_DOMAIN_SETUP="true"     # Enable domain setup for staging

# CloudFormation Template Configuration
CLOUDFORMATION_TEMPLATES_DIR="."
MAIN_TEMPLATE="cloudformation-main-template.yaml"
IAM_ROLES_TEMPLATE="cloudformation-iam-roles-template.yaml"
GLOBAL_TEMPLATE="cloudformation-global-template.yaml"
NETWORK_TEMPLATE="cloudformation-network-template.yaml"
STORAGE_TEMPLATE="cloudformation-storage-template.yaml"
BACKEND_TEMPLATE="cloudformation-backend-template.yaml"
DOMAIN_TEMPLATE="cloudformation-domain-template.yaml"

# Build Configuration
BUILD_ENVIRONMENT="staging"
NODE_ENV="staging"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-ontology-ui
  labels:
    app: nexus-ontology-ui
    app.kubernetes.io/name: nexus-ontology-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: nexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-ontology-ui
  template:
    metadata:
      labels:
        app: nexus-ontology-ui
        app.kubernetes.io/name: nexus-ontology-ui
        app.kubernetes.io/component: ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: ui
          image: REPLACE_WITH_ECR_REGISTRY/nexus-ontology-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}

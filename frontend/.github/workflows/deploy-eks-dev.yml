name: Deploy Frontend to EKS (Dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'EKS cluster name override (leave empty for environment default)'
        required: false
        type: string

env:
  AWS_REGION: 'us-east-1'
  DEPLOY_ENV: 'dev'
  IMAGE_NAME: 'nexus-ui'

jobs:
  deploy-eks:
    runs-on: ubuntu-latest
    environment: eks-dev
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Checkout docs repo
      uses: actions/checkout@v4
      with:
        repository: nexusdataai/nexus-docs
        token: ${{ secrets.GH_PAT }}
        path: nexus-docs

    - name: Build MkDocs documentation
      run: |
        pip install -q -r nexus-docs/requirements.txt
        cd nexus-docs && python -m mkdocs build -q && cd ..
        rm -rf docs-site
        cp -r nexus-docs/site docs-site
        echo "Docs built: $(find docs-site -name 'index.html' | wc -l) pages"

    - name: Prepare build context
      run: |
        npm install --package-lock-only --ignore-scripts --no-audit --no-fund 2>/dev/null || touch package-lock.json

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Configure kubectl
      run: |
        CLUSTER="${{ inputs.cluster_name || vars.EKS_CLUSTER_NAME || 'nexus-dev' }}"
        aws eks update-kubeconfig --name "${CLUSTER}" --region ${{ env.AWS_REGION }}
        echo "Configured kubectl for cluster: ${CLUSTER}"

    - name: Deploy frontend
      run: |
        NAMESPACE="nexus-ai-${{ env.DEPLOY_ENV }}"
        echo "Restarting frontend pods in ${NAMESPACE}..."
        kubectl delete pods -l app=${NAMESPACE}-frontend -n ${NAMESPACE} --grace-period=5 --wait=false
        echo "Waiting for pods to be ready..."
        kubectl wait --for=condition=ready pod -l app=${NAMESPACE}-frontend -n ${NAMESPACE} --timeout=150s || echo "Frontend pods still starting..."

    - name: Deployment summary
      if: always()
      run: |
        NAMESPACE="nexus-ai-${{ env.DEPLOY_ENV }}"
        CLUSTER="${{ inputs.cluster_name || vars.EKS_CLUSTER_NAME || 'nexus-dev' }}"

        echo "## EKS Frontend Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
        echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
        echo "| Environment | \`${{ env.DEPLOY_ENV }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Cluster | \`${CLUSTER}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Namespace | \`${NAMESPACE}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Image | \`${{ env.IMAGE_NAME }}:latest\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"

        echo "### Pod Status" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        kubectl get pods -l app=${NAMESPACE}-frontend -n ${NAMESPACE} 2>&1 >> "$GITHUB_STEP_SUMMARY" || echo "Could not retrieve pod status" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

        ALB_HOST=$(kubectl get ingress ${NAMESPACE}-app-ingress -n ${NAMESPACE} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
        if [ -n "$ALB_HOST" ]; then
          ALB_CERT=$(kubectl get ingress ${NAMESPACE}-app-ingress -n ${NAMESPACE} -o jsonpath='{.metadata.annotations.alb\.ingress\.kubernetes\.io/certificate-arn}' 2>/dev/null || echo "")
          SCHEME="http"
          [ -n "$ALB_CERT" ] && SCHEME="https"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Application URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public: \`${SCHEME}://${ALB_HOST}\`" >> "$GITHUB_STEP_SUMMARY"
        fi
